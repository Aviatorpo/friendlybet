name: Diagnose football-data API

# On-demand health check of the live match API: rate-limit headroom, team-name
# coverage (silent-drop guard), status/stage values, and the score object shape.
on:
  workflow_dispatch:
  schedule:
    # Weekly safety net so a football-data rename (e.g. Turkey -> Türkiye) that
    # would silently drop matches is caught BEFORE the tournament, not during.
    - cron: '0 6 * * 1'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe football-data API
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/diag-football-api.js
