name: Prebuild World Cup Story Bases

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum new base images to generate in this run (0 = all missing)'
        type: string
        default: '6'
  schedule:
    # Prepare upcoming match outcome bases ahead of live windows. Keep the run
    # bounded so content automation cannot become a cost sink.
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: prebuild-world-cup-story-bases
  cancel-in-progress: false

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install story image tooling
        run: python3 -m pip install --user pillow pypdf

      - name: Prepare local outcome bases
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WC_STORY_MATCH_SOURCE: snapshot
          WC_STORY_PREBUILD_GENERATE: '1'
          WC_STORY_PREBUILD_LIMIT: ${{ inputs.limit || '6' }}
        run: node scripts/prebuild-world-cup-story-outcome-bases.js

      - name: Audit prepared story base image quality
        env:
          WC_STORY_AUDIT_SKIP_UNINDEXED_BASES: '1'
        run: python3 scripts/audit-world-cup-story-images.py --scope bases

      - name: Commit outcome-base index if changed
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain story-assets/outcome-bases)" ]; then
            git add story-assets/outcome-bases
            git commit -q -m "story: refresh World Cup outcome base index"
            pushed=0
            for a in 1 2 3; do
              if git pull --rebase --autostash && git push; then pushed=1; break; fi
              echo "push retry $a"; sleep 4
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push World Cup story bases after 3 retries"
              exit 1
            fi
          else
            echo "no outcome base changes"
          fi
