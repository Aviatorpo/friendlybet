name: Lock Pools At Kickoff

# Guarantees pools lock when the World Cup kicks off, even if no member opens the
# app. The script is a cheap no-op until LOCK_KICKOFF_ISO passes, then it locks
# every unlocked single/two-phase pool whose effective deadline has passed.
# A future lock_at_override keeps affected pools editable until their extension
# deadline; normal pools lock at kickoff.
on:
  schedule:
    # Free-tier Supabase can exhaust Disk IO during match windows. This job is a
    # safety net, not a live feature, so hourly is enough and avoids API pressure.
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-pools
  cancel-in-progress: false

jobs:
  lock-pools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Lock pools once the World Cup has kicked off
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/lock-pools.js || { echo "::warning::lock-pools skipped after transient Supabase failure"; exit 0; }
          else
            node scripts/lock-pools.js
          fi
