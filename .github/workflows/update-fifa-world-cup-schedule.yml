name: Update FIFA World Cup Schedule

on:
  # UTC. These are short 15-minute-cadence windows around remaining WC 2026
  # kickoff/result/update periods; the script also no-ops outside exact windows.
  schedule:
    - cron: '4,19,34,49 18-23 28 6 *'
    - cron: '4,19,34,49 0-6,16-23 29 6 *'
    - cron: '4,19,34,49 0-7,16-23 30 6 *'
    - cron: '4,19,34,49 0-7,15-23 1 7 *'
    - cron: '4,19,34,49 0-7,18-23 2 7 *'
    - cron: '4,19,34,49 0-9,17-23 3 7 *'
    - cron: '4,19,34,49 0-7,16-23 4 7 *'
    - cron: '4,19,34,49 0-7,19-23 5 7 *'
    - cron: '4,19,34,49 0-7,18-23 6 7 *'
    - cron: '4,19,34,49 0-7,15-23 7 7 *'
    - cron: '4,19,34,49 19-23 9 7 *'
    - cron: '4,19,34,49 0-3,18-23 10 7 *'
    - cron: '4,19,34,49 0-2,20-23 11 7 *'
    - cron: '4,19,34,49 0-7 12 7 *'
    - cron: '4,19,34,49 18-23 14 7 *'
    - cron: '4,19,34,49 0-2,18-23 15 7 *'
    - cron: '4,19,34,49 20-23 18 7 *'
    - cron: '4,19,34,49 0-2,18-23 19 7 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-fifa-world-cup-schedule
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Refresh official FIFA schedule when useful
        run: node scripts/update-fifa-world-cup-schedule.js --if-window

      - name: Bridge FIFA schedule into scoring matches table
        id: schedule_bridge
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync-fifa-schedule-to-matches.js --include-placeholders --fail-missing-known-within-hours=36

      - name: Export match snapshot after schedule bridge
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Commit schedule snapshot if changed
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          REGENERATE_COMMANDS: |
            node scripts/update-fifa-world-cup-schedule.js --if-window
            node scripts/sync-fifa-schedule-to-matches.js --include-placeholders --fail-missing-known-within-hours=36
            node scripts/export-snapshots.js matches
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- public-data/world-cup-schedule.json public-data/matches.json)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: refresh FIFA schedule and match bridge" public-data/world-cup-schedule.json public-data/matches.json
          else
            echo "no FIFA schedule or match snapshot change"
          fi

      - name: Dispatch scoring after scoreable schedule result
        if: steps.schedule_bridge.outputs.scoreable_result_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active_scoring_runs="$(gh run list --workflow calculate-scores-v2.yml --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "${active_scoring_runs:-0}" = "0" ]; then
            gh workflow run calculate-scores-v2.yml --ref main -f force_leaderboard_export=true -f force_backup=false -f restore_from_snapshot=false -f pool_ids=''
            echo "::warning::FIFA schedule bridge changed scoreable result_version from ${{ steps.schedule_bridge.outputs.result_version_before }} to ${{ steps.schedule_bridge.outputs.result_version_after }}; dispatched forced scoring and leaderboard publication."
          else
            echo "::warning::FIFA schedule bridge changed scoreable result_version, but scoring is already queued or running."
          fi
