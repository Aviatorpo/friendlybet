# ============================================================
# FriendlyBet v2 - Score Calculation Workflow
# ============================================================
# Runs hourly to recompute scores using the v2 logic
# (single_phase + two_phase aware) for v2.0.0+ pools.
# ============================================================

name: Calculate User Scores (v2)

on:
  schedule:
    # Hourly while Supabase free-tier Disk IO is depleted. Scoring is idempotent,
    # and early group-stage points do not settle until groups are complete.
    - cron: '28 * * * *'
  workflow_dispatch:
    inputs:
      force_backup:
        description: 'Create a critical-data backup even if no new final match is detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      pool_ids:
        description: 'Optional comma-separated pool ids/codes to score'
        required: false
        default: ''
        type: string
      restore_from_snapshot:
        description: 'Restore group/bonus components from public snapshots before scoring pool_ids'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# Pillar 4: never let two score runs overlap — a new run queues instead of racing the
# writer (the recompute is idempotent, so we just need them serialized, not cancelled).
concurrency:
  group: calculate-scores-v2
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Repair persisted pick multipliers
        timeout-minutes: 10
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/repair-pick-multipliers.js

      - name: Restore group score components from public snapshots
        if: inputs.restore_from_snapshot == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESTORE_POOL_IDS: ${{ inputs.pool_ids }}
          PUBLIC_BASE_URL: https://friendlybet.live
        run: node scripts/restore-score-components-from-snapshots.js

      - name: Calculate scores (v2)
        id: score_results
        timeout-minutes: 45
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
          SCORING_POOL_IDS: ${{ inputs.pool_ids }}
        run: node scripts/calculate-scores-v2.js --critical
      # Pillar 1: refresh CDN snapshots (matches + per-pool leaderboards) after scoring,
      # so clients read standings from the edge instead of full-table reads of `users`.
      - name: Export CDN snapshots
        if: steps.score_results.outputs.changed_pool_ids != '' || inputs.pool_ids != ''
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids || inputs.pool_ids }}
        run: node scripts/export-snapshots.js leaderboards

      - name: Verify scoring snapshots
        if: steps.score_results.outputs.changed_pool_ids != '' || inputs.pool_ids != ''
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids || inputs.pool_ids }}
        run: node scripts/verify-scoring-snapshots.js

      - name: Generate knockout scoring scenarios
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_VERBOSE: '0'
          KNOCKOUT_SCENARIO_TARGETS: BRA-JPN
        run: node scripts/generate-knockout-scenarios.js

      - name: Encrypted critical-data backup after finished matches
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_FORCE: ${{ inputs.force_backup == 'true' && '1' || '' }}
        run: node scripts/backup-critical-data.js

      # "Pool Pundit" leaderboard banter: diff standings vs the stored snapshot and
      # turn the moves into witty per-pool commentary (public-data/banter/*.json).
      # Best-effort: never fail the scoring run if banter generation stumbles.
      - name: Generate leaderboard banter
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/generate-banter.js

      - name: Install story image audit tooling
        run: python3 -m pip install --user pillow pypdf

      - name: Audit World Cup story image quality
        continue-on-error: true
        run: python3 scripts/audit-world-cup-story-images.py --scope stories

      - name: Validate World Cup stories
        continue-on-error: true
        run: node scripts/test-world-cup-stories.js

      - name: Commit snapshots if changed
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_FORCE: ${{ inputs.force_backup == 'true' && '1' || '' }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids || inputs.pool_ids }}
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
          REGENERATE_COMMANDS: |
            node scripts/repair-pick-multipliers.js
            if [ "${{ inputs.restore_from_snapshot }}" = "true" ]; then RESTORE_POOL_IDS="${{ inputs.pool_ids }}" node scripts/restore-score-components-from-snapshots.js || true; fi
            SCORING_POOL_IDS="${{ inputs.pool_ids }}" node scripts/calculate-scores-v2.js --critical
            node scripts/export-snapshots.js leaderboards
            node scripts/verify-scoring-snapshots.js
            node scripts/generate-knockout-scenarios.js || true
            node scripts/backup-critical-data.js
            node scripts/generate-banter.js || true
            python3 scripts/audit-world-cup-story-images.py --scope stories || true
            node scripts/test-world-cup-stories.js || true
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data private-backups)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: refresh CDN snapshots / critical backup" public-data private-backups
          else
            echo "no snapshot change"
          fi

      - name: Prove public scoring snapshots
        if: steps.score_results.outputs.changed_pool_ids != '' || inputs.pool_ids != ''
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids || inputs.pool_ids }}
          SCORING_SNAPSHOT_PUBLIC_BASE_URL: https://friendlybet.live
          SCORING_SNAPSHOT_PUBLIC_RETRIES: 12
          SCORING_SNAPSHOT_PUBLIC_RETRY_MS: 10000
        run: node scripts/verify-scoring-snapshots.js
