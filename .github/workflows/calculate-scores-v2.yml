# ============================================================
# FriendlyBet v2 - Score Calculation Workflow
# ============================================================
# Runs every 30 minutes to recompute scores using the v2 logic
# (single_phase + two_phase aware). Replaces calculate-scores.yml
# for v2.0.0+ pools.
# ============================================================

name: Calculate User Scores (v2)

on:
  schedule:
    # Hourly while Supabase free-tier Disk IO is depleted. Scoring is idempotent,
    # and early group-stage points do not settle until groups are complete.
    - cron: '28 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Pillar 4: never let two score runs overlap — a new run queues instead of racing the
# writer (the recompute is idempotent, so we just need them serialized, not cancelled).
concurrency:
  group: calculate-scores-v2
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Calculate scores (v2)
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/calculate-scores-v2.js || { echo "::warning::score calculation skipped after transient Supabase failure"; exit 0; }
          else
            node scripts/calculate-scores-v2.js
          fi

      # Pillar 1: refresh CDN snapshots (matches + per-pool leaderboards) after scoring,
      # so clients read standings from the edge instead of full-table reads of `users`.
      - name: Export CDN snapshots
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/export-snapshots.js leaderboards || { echo "::warning::leaderboard snapshot export skipped after transient Supabase failure"; exit 0; }
          else
            node scripts/export-snapshots.js leaderboards
          fi

      - name: Encrypted critical-data backup after finished matches
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/backup-critical-data.js || { echo "::warning::critical-data backup skipped after transient Supabase failure"; exit 0; }
          else
            node scripts/backup-critical-data.js
          fi

      # "Pool Pundit" leaderboard banter: diff standings vs the stored snapshot and
      # turn the moves into witty per-pool commentary (public-data/banter/*.json).
      # Best-effort: never fail the scoring run if banter generation stumbles.
      - name: Generate leaderboard banter
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/generate-banter.js

      - name: Generate World Cup stories
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1024x1536' }}
        run: node scripts/generate-world-cup-stories.js

      - name: Validate World Cup stories
        run: node scripts/test-world-cup-stories.js

      - name: Commit snapshots if changed
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data private-backups story-assets)" ]; then
            git add public-data private-backups story-assets
            git commit -q -m "data: refresh CDN snapshots / stories / critical backup"
            pushed=0
            for a in 1 2 3; do
              if git pull --rebase --autostash && git push; then pushed=1; break; fi
              echo "push retry $a"; sleep 4
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push score snapshots after 3 retries"
              exit 1
            fi
          else
            echo "no snapshot change"
          fi
