name: Generate Pundit Feed

# Rebuilds public-data/pundit.json from a fresh Supabase-backed match snapshot
# + the verified news file. The match snapshot is committed with the Pundit feed
# so the feed never references result/live state that public-data/matches.json
# cannot prove.
# Covers both phases: pre-tournament the countdown/fixtures shift daily, during
# the group stage live/fixture/result wording can shift at kickoff, full time,
# or when a verification state appears. The job runs every 10 minutes, but only
# pushes when the Pundit feed itself changes; match-only live churn is discarded
# so we do not turn every clock tick into a Vercel deploy.

on:
  schedule:
    - cron: '3,13,23,33,43,53 * 11-28 6 *'   # group-stage live desk, offset from poller/verifier
    - cron: '3,13,23,33,43,53 16-23 29 6 *'   # first knockout day
    - cron: '3,13,23,33,43,53 0-7,16-23 30 6 *'
    - cron: '3,13,23,33,43,53 0-7,15-23 1 7 *'
    - cron: '3,13,23,33,43,53 0-7,18-23 2 7 *'
    - cron: '3,13,23,33,43,53 0-9,17-23 3 7 *'
    - cron: '3,13,23,33,43,53 0-7,16-23 4 7 *'
    - cron: '3,13,23,33,43,53 0-7,19-23 5 7 *'
    - cron: '3,13,23,33,43,53 0-7,18-23 6 7 *'
    - cron: '3,13,23,33,43,53 0-7,15-23 7 7 *'
    - cron: '3,13,23,33,43,53 19-23 9 7 *'
    - cron: '3,13,23,33,43,53 0-3,18-23 10 7 *'
    - cron: '3,13,23,33,43,53 0-2,20-23 11 7 *'
    - cron: '3,13,23,33,43,53 0-7 12 7 *'
    - cron: '3,13,23,33,43,53 18-23 14 7 *'
    - cron: '3,13,23,33,43,53 0-2,18-23 15 7 *'
    - cron: '3,13,23,33,43,53 20-23 18 7 *'
    - cron: '3,13,23,33,43,53 0-2,18-23 19 7 *'
    - cron: '7 */3 * * *'   # quiet refresh outside the group-stage live window
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-pundit
  cancel-in-progress: false

jobs:
  generate-pundit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Export current match snapshot
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Check for prepared World Cup story work
        id: story_work
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/publish-world-cup-stories-auto.js

      - name: Audit match/story state before Pundit build
        env:
          LIVE_OPS_SKIP_PUNDIT: '1'
          LIVE_OPS_IGNORE_SNAPSHOT_LIVE_STATUS: '1'
          LIVE_OPS_ALLOW_STORY_BACKLOG: '1'
        run: node scripts/live-ops-audit.js

      # Guard: if a news file exists, it must pass the verification gate. A bad
      # file fails the run instead of shipping unverified claims.
      - name: Validate pundit news (if present)
        run: |
          if [ -f public-data/pundit-news.json ]; then
            node scripts/pundit-news-validate.js
          else
            echo "no pundit-news.json yet, skipping validation"
          fi

      - name: Build pundit feed
        run: node scripts/generate-pundit.js

      - name: Validate generated Pundit feed
        run: node scripts/test-pundit-feed.js

      - name: Commit feed if changed
        env:
          REGENERATE_COMMANDS: |
            node scripts/export-snapshots.js matches
            node scripts/world-cup-story-auto-needed.js > /tmp/friendlybet-story-needed.txt; cat /tmp/friendlybet-story-needed.txt; if grep -q 'publishable=true' /tmp/friendlybet-story-needed.txt; then python3 -m pip install --user pillow pypdf; node scripts/publish-world-cup-stories-auto.js; fi
            LIVE_OPS_SKIP_PUNDIT=1 LIVE_OPS_IGNORE_SNAPSHOT_LIVE_STATUS=1 LIVE_OPS_ALLOW_STORY_BACKLOG=1 node scripts/live-ops-audit.js
            if [ -f public-data/pundit-news.json ]; then node scripts/pundit-news-validate.js; else echo "no pundit-news.json yet, skipping validation"; fi
            node scripts/generate-pundit.js
            node scripts/test-pundit-feed.js
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/pundit.json public-data/world-cup-stories.json story-assets)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: refresh pundit feed and stories" public-data/matches.json public-data/pundit.json public-data/world-cup-stories.json story-assets
          elif [ -n "$(git status --porcelain public-data/matches.json)" ]; then
            echo "match snapshot changed without a Pundit feed change; skipping commit to avoid live-score deploy churn"
          else
            echo "no pundit change"
          fi
