# ============================================================
# FriendlyBet - Score Calculation Workflow (LEGACY / v1)
# ============================================================
# DISABLED on schedule as of v2.5.76. The v2 workflow
# (calculate-scores-v2.yml) supersedes this and scores BOTH
# single_phase and two_phase pools. Running both on the same
# cron caused them to overwrite each other's user score columns
# (total_score / groups_score / knockout_score) every 30 min.
# Kept here for reference + manual dispatch only.
# ============================================================

name: Calculate User Scores (LEGACY v1 - manual only)

on:
  # Schedule removed - v2 owns scoring now. Manual trigger only.
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Calculate scores
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/calculate-scores.js
