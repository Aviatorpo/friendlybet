name: Sync Player Squads

on:
  # SCHEDULE GATED 2026-06-10 (pre-kickoff): sync-players.js still does a destructive
  # full rebuild — DELETE all `players` then re-insert. If the API is partial/rate-
  # limited or an insert fails after the delete, the players table is left empty and
  # top-scorer pick/display/scoring degrades. Squads are already synced (~1175 rows),
  # so there is no need to run this on a schedule before kickoff. Re-enable the cron
  # only after sync-players.js is converted to upsert-only (validate-then-write).
  # Manual runs are still allowed via workflow_dispatch for a reviewed, deliberate sync.
  # schedule:
  #   - cron: '0 3 * * *'   # daily 03:00 UTC — disabled, see note above
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Sync players from football-data.org
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-players.js
