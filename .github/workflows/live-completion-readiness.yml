name: Live Completion Readiness Monitor

# Production-facing safety net for live tournament completion. This does not write
# data unless stale active-match state is detected. It checks the public
# snapshots users see and, by default, audits live Supabase match state so stale
# finals, missing stories, stale Pundit, or broken scoring/UX guards fail loudly
# during match days, including knockouts. If the dedicated live-poller cron was delayed or dropped,
# this monitor runs the live poller once and then re-runs the gate.
on:
  schedule:
    - cron: '6,16,26,36,46,56 * 11-28 6 *'
    - cron: '6,16,26,36,46,56 16-23 29 6 *'
    - cron: '6,16,26,36,46,56 0-7,16-23 30 6 *'
    - cron: '6,16,26,36,46,56 0-7,15-23 1 7 *'
    - cron: '6,16,26,36,46,56 0-7,18-23 2 7 *'
    - cron: '6,16,26,36,46,56 0-9,17-23 3 7 *'
    - cron: '6,16,26,36,46,56 0-7,16-23 4 7 *'
    - cron: '6,16,26,36,46,56 0-7,19-23 5 7 *'
    - cron: '6,16,26,36,46,56 0-7,18-23 6 7 *'
    - cron: '6,16,26,36,46,56 0-7,15-23 7 7 *'
    - cron: '6,16,26,36,46,56 19-23 9 7 *'
    - cron: '6,16,26,36,46,56 0-3,18-23 10 7 *'
    - cron: '6,16,26,36,46,56 0-2,20-23 11 7 *'
    - cron: '6,16,26,36,46,56 0-7 12 7 *'
    - cron: '6,16,26,36,46,56 18-23 14 7 *'
    - cron: '6,16,26,36,46,56 0-2,18-23 15 7 *'
    - cron: '6,16,26,36,46,56 20-23 18 7 *'
    - cron: '6,16,26,36,46,56 0-2,18-23 19 7 *'
  workflow_dispatch:
    inputs:
      check_db:
        description: 'Audit live Supabase match state'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: live-completion-readiness
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run production readiness gate with stale-live recovery
        env:
          LIVE_COMPLETION_PUBLIC_BASE_URL: https://friendlybet.live
          LIVE_COMPLETION_GITHUB_WORKFLOWS: '1'
          LIVE_COMPLETION_ALLOW_STORY_BACKLOG: '1'
          LIVE_COMPLETION_SKIP_PUNDIT: '1'
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ github.event.inputs.check_db || 'true' }}" = "false" ]; then
            node scripts/live-completion-readiness.js > readiness-before.json
          else
            LIVE_COMPLETION_DB_SOURCE=supabase node scripts/live-completion-readiness.js > readiness-before.json
          fi
          status=$?
          cat readiness-before.json
          node scripts/live-ops-summary.js readiness-before.json >> "$GITHUB_STEP_SUMMARY"
          set -e
          if [ "$status" = "0" ]; then
            exit 0
          fi

          stale_live_db=$(node -e "const r=require('./readiness-before.json'); const c=(r.checks||[]).find(x=>x.name==='live DB active match state is fresh'); process.stdout.write(c && !c.ok ? '1' : '0')")
          stale_live_poller=$(node -e "const r=require('./readiness-before.json'); const c=(r.checks||[]).find(x=>x.name==='live poller workflow ran recently'); process.stdout.write(c && !c.ok ? '1' : '0')")
          stale_score_publication=$(node -e "const r=require('./readiness-before.json'); const c=(r.checks||[]).find(x=>x.name==='score publication is current for latest result_version'); process.stdout.write(c && !c.ok ? '1' : '0')")
          if [ "$stale_live_db" != "1" ] && [ "$stale_live_poller" != "1" ] && [ "$stale_score_publication" != "1" ]; then
            node scripts/send-telegram-incident.js readiness-before.json || true
            exit "$status"
          fi

          recovery_dispatched=0
          final_detected=false
          if [ "$stale_live_db" = "1" ] || [ "$stale_live_poller" = "1" ]; then
            echo "::warning::Readiness detected stale live-poller coverage; running one live-poller recovery pass directly."
            poller_output="$(mktemp)"
            GITHUB_OUTPUT="$poller_output" node scripts/live-poller.js
            cat "$poller_output"
            final_detected="$(grep '^final_detected=' "$poller_output" | tail -n 1 | cut -d= -f2- || true)"
          fi
          if [ "$stale_live_db" = "1" ] || [ "$final_detected" = "true" ] || [ "$stale_score_publication" = "1" ]; then
            if FORCE_MATCH_SNAPSHOT=1 node scripts/export-snapshots.js matches; then
              if [ -n "$(git status --porcelain public-data/matches.json)" ]; then
                git config user.name "Aviatorpo"
                git config user.email "283137823+Aviatorpo@users.noreply.github.com"
                REGENERATE_COMMANDS="FORCE_MATCH_SNAPSHOT=1 node scripts/export-snapshots.js matches" bash scripts/commit-generated-snapshots.sh "data: refresh match snapshot after readiness recovery" public-data/matches.json || echo "::warning::Fast match snapshot commit failed; scoring/export recovery will still run."
              else
                echo "no fast match snapshot change"
              fi
            else
              echo "::warning::Fast match snapshot export failed; scoring/export recovery will still run."
            fi
            active_scoring_runs="$(gh run list --workflow calculate-scores-v2.yml --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
            if [ "${active_scoring_runs:-0}" = "0" ]; then
              gh workflow run calculate-scores-v2.yml --ref main -f force_leaderboard_export=true -f force_backup=false -f restore_from_snapshot=false -f pool_ids=''
              recovery_dispatched=1
              echo "::warning::Readiness found stale terminal match scoring/publication state; dispatched forced scoring and public snapshot export."
            else
              recovery_dispatched=1
              echo "::warning::Scoring/export recovery is already queued or running; skipping duplicate dispatch."
            fi
          fi
          export LIVE_COMPLETION_LOCAL_POLLER_RECOVERY_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          set +e
          if [ "${{ github.event.inputs.check_db || 'true' }}" = "false" ]; then
            node scripts/live-completion-readiness.js > readiness-after.json
          else
            LIVE_COMPLETION_DB_SOURCE=supabase node scripts/live-completion-readiness.js > readiness-after.json
          fi
          status_after=$?
          cat readiness-after.json
          node scripts/live-ops-summary.js readiness-after.json >> "$GITHUB_STEP_SUMMARY"
          set -e
          if [ "$status_after" != "0" ]; then
            if [ "$recovery_dispatched" = "1" ]; then
              echo "::warning::Readiness remains red while scoring/export recovery is queued or running; calculate-scores-v2 owns the final publication proof."
              exit 0
            fi
            node scripts/send-telegram-incident.js readiness-after.json || true
            exit "$status_after"
          fi
