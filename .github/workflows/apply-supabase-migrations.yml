name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Optional migration file to apply, e.g. migrations/2026-06-19-change-nickname.sql'
        required: false
        default: ''
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      INPUT_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.file || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Validate secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)

      - name: Link Supabase project
        run: |
          supabase init
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Select migration files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/friendlybet-migrations.txt

          if [[ -n "$INPUT_FILE" ]]; then
            printf '%s\n' "$INPUT_FILE" >> /tmp/friendlybet-migrations.txt
          fi

          sort -u /tmp/friendlybet-migrations.txt -o /tmp/friendlybet-migrations.txt
          if [[ ! -s /tmp/friendlybet-migrations.txt ]]; then
            echo "No migration files selected."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            [[ "$file" == migrations/*.sql ]] || (echo "Refusing non-migration path: $file" && exit 1)
            [[ -f "$file" ]] || (echo "Migration file not found: $file" && exit 1)
          done < /tmp/friendlybet-migrations.txt

          echo "Selected migrations:"
          cat /tmp/friendlybet-migrations.txt
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Apply selected migrations
        if: steps.files.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::Applying $file"
            supabase db query --linked --file "$file"
            echo "::endgroup::"
          done < /tmp/friendlybet-migrations.txt
