name: Verify Final Results with ESPN and FIFA

on:
  schedule:
    # UTC windows generated from public-data/matches.json for known group-stage
    # kickoffs. Each run is cheap: it preflights first, backs off verifier
    # attempts, and only calls providers when a stale match is due.
    - cron: '*/15 17-23 18 6 *'
    - cron: '*/15 0-6,20-23 19 6 *'
    - cron: '*/15 0-8,18-23 20 6 *'
    - cron: '*/15 0-9,17-23 21 6 *'
    - cron: '*/15 0-6,18-23 22 6 *'
    - cron: '*/15 0-8,18-23 23 6 *'
    - cron: '*/15 0-7,20-23 24 6 *'
    - cron: '*/15 0-6,21-23 25 6 *'
    - cron: '*/15 0-7,20-23 26 6 *'
    - cron: '*/15 0-8,22-23 27 6 *'
    - cron: '*/15 0-7 28 6 *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write verified final results to Supabase'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: final-result-verifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Check final-result window
        id: result_preflight
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_FALLBACK_MIN_AGE_MINUTES: 105
          RESULT_FALLBACK_LOOKBACK_HOURS: 48
          RESULT_FALLBACK_BACKOFF: '0'
          RESULT_FALLBACK_RUN_EVERY_MINUTES: 15
        run: node scripts/final-result-verifier-needed.js

      - name: Verify stuck final results
        id: verify_results
        if: github.event_name != 'schedule' || steps.result_preflight.outputs.needed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_FALLBACK_MIN_AGE_MINUTES: 105
          RESULT_FALLBACK_MIN_SOURCES: 2
          RESULT_FALLBACK_REQUIRED_SOURCES: espn,fifa
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/final-result-verifier.js --apply || { echo "::warning::final-result verifier skipped after transient Supabase/provider failure"; exit 0; }
          elif [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/final-result-verifier.js --apply
          else
            node scripts/final-result-verifier.js
          fi

      - name: Export match snapshot
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/export-snapshots.js matches || { echo "::warning::match snapshot export skipped after transient Supabase failure"; exit 0; }
          else
            node scripts/export-snapshots.js matches
          fi

      - name: Commit match snapshot if changed
        if: steps.verify_results.outputs.changed == 'true'
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/matches.json)" ]; then
            git add public-data/matches.json
            git commit -q -m "data: refresh match results snapshot"
            pushed=0
            for a in 1 2 3; do
              if git pull --rebase --autostash && git push; then pushed=1; break; fi
              echo "push retry $a"; sleep 4
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push match snapshot after 3 retries"
              exit 1
            fi
          else
            echo "no match snapshot change"
          fi

      - name: Validate existing World Cup stories
        run: node scripts/test-world-cup-stories.js

      - name: Check for World Cup story work
        id: story_work
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/publish-world-cup-stories-auto.js

      - name: Commit World Cup stories if changed
        if: steps.story_work.outputs.publishable == 'true'
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/world-cup-stories.json story-assets)" ]; then
            git add public-data/world-cup-stories.json story-assets
            git commit -q -m "story: auto-publish World Cup story"
            pushed=0
            for a in 1 2 3; do
              if git pull --rebase --autostash && git push; then pushed=1; break; fi
              echo "push retry $a"; sleep 4
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push World Cup stories after 3 retries"
              exit 1
            fi
          else
            echo "no World Cup story change"
          fi
