name: Verify Final Results with ESPN and FIFA

on:
  schedule:
    # Cheap continuous recovery during the full tournament match windows. The
    # preflight/backoff step exits before provider calls unless a stale result is
    # actually due, so this removes multi-hour gaps without adding API-style load.
    - cron: '4,19,34,49 * 11-28 6 *'
    - cron: '4,19,34,49 16-23 29 6 *'
    - cron: '4,19,34,49 0-7,16-23 30 6 *'
    - cron: '4,19,34,49 0-7,15-23 1 7 *'
    - cron: '4,19,34,49 0-7,18-23 2 7 *'
    - cron: '4,19,34,49 0-9,17-23 3 7 *'
    - cron: '4,19,34,49 0-7,16-23 4 7 *'
    - cron: '4,19,34,49 0-7,19-23 5 7 *'
    - cron: '4,19,34,49 0-7,18-23 6 7 *'
    - cron: '4,19,34,49 0-7,15-23 7 7 *'
    - cron: '4,19,34,49 19-23 9 7 *'
    - cron: '4,19,34,49 0-3,18-23 10 7 *'
    - cron: '4,19,34,49 0-2,20-23 11 7 *'
    - cron: '4,19,34,49 0-7 12 7 *'
    - cron: '4,19,34,49 18-23 14 7 *'
    - cron: '4,19,34,49 0-2,18-23 15 7 *'
    - cron: '4,19,34,49 20-23 18 7 *'
    - cron: '4,19,34,49 0-2,18-23 19 7 *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write verified final results to Supabase'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      lookback_hours:
        description: 'Verifier lookback window in hours'
        required: true
        default: '336'
        type: choice
        options:
          - '96'
          - '168'
          - '336'
      backoff:
        description: 'Use bounded backoff for scheduled recovery checks'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      emergency_sources:
        description: 'Use approved emergency result sources in addition to ESPN/FIFA'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      source_hint_urls:
        description: 'Optional emergency article URLs, separated by spaces or new lines'
        required: false
        default: ''
        type: string

concurrency:
  group: final-result-verifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Check final-result window
        id: result_preflight
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_FALLBACK_MIN_AGE_MINUTES: 95
          RESULT_FALLBACK_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '336' }}
          RESULT_FALLBACK_BACKOFF: ${{ github.event.inputs.backoff || '1' }}
          RESULT_FALLBACK_RUN_EVERY_MINUTES: 15
        run: node scripts/final-result-verifier-needed.js

      - name: Report queued final-result recovery
        if: steps.result_preflight.outputs.candidate_count != '' && steps.result_preflight.outputs.candidate_count != '0'
        run: |
          echo "::notice::Final-result recovery queue: candidates=${{ steps.result_preflight.outputs.candidate_count }} due=${{ steps.result_preflight.outputs.due_count }} waiting=${{ steps.result_preflight.outputs.waiting_count }} source=${{ steps.result_preflight.outputs.source }}"

      - name: Verify stuck final results
        id: verify_results
        if: github.event_name != 'schedule' || steps.result_preflight.outputs.needed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_FALLBACK_MIN_AGE_MINUTES: 95
          RESULT_FALLBACK_LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '336' }}
          RESULT_FALLBACK_MIN_SOURCES: 1
          RESULT_FALLBACK_REQUIRED_SOURCES: fifa
          RESULT_FALLBACK_SOURCES: ${{ github.event_name != 'schedule' && inputs.emergency_sources == 'true' && 'espn,fifa,livescore,fox,yahoo,guardian,ap,houston_chronicle,nypost' || 'espn,fifa' }}
          RESULT_CONSENSUS_FALLBACK_MIN_SOURCES: 3
          RESULT_FALLBACK_SOURCE_MODE: ${{ github.event_name == 'schedule' && 'rotate' || 'all' }}
          RESULT_FALLBACK_ROTATION_MINUTES: 15
          RESULT_FALLBACK_OBSERVATION_TTL_MINUTES: 180
          RESULT_AUTO_EMERGENCY_SOURCES: '1'
          RESULT_AUTO_EMERGENCY_AFTER_MINUTES: 105
          RESULT_AUTO_EMERGENCY_SOURCE_MODE: all
          RESULT_EMERGENCY_SOURCES: ${{ github.event_name != 'schedule' && inputs.emergency_sources == 'true' && '1' || '0' }}
          RESULT_EMERGENCY_SOURCE_HINTS: ${{ github.event.inputs.source_hint_urls || '' }}
          RESULT_VERIFICATION_REPORT_PATH: artifacts/final-result-verification-report.json
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/final-result-verifier.js --apply
          elif [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/final-result-verifier.js --apply
          else
            node scripts/final-result-verifier.js
          fi

      - name: Upload final-result verification report
        if: always() && steps.verify_results.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: final-result-verification-report
          path: artifacts/final-result-verification-report.json
          if-no-files-found: warn

      - name: Export match snapshot
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/export-snapshots.js matches
          else
            node scripts/export-snapshots.js matches
          fi

      - name: Commit match snapshot if changed
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          REGENERATE_COMMANDS: |
            node scripts/export-snapshots.js matches
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/matches.json)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: refresh match results snapshot" public-data/matches.json
          else
            echo "no match snapshot change"
          fi

      - name: Refresh FIFA schedule before scoring
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/update-fifa-world-cup-schedule.js

      - name: Bridge next knockout fixtures before scoring
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync-fifa-schedule-to-matches.js --include-placeholders --fail-missing-known-within-hours=36

      - name: Calculate scores after verified final result
        id: score_results
        if: steps.verify_results.outputs.changed == 'true'
        timeout-minutes: 12
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
          SCORING_FORCE_SCORE_HEARTBEAT: '1'
        run: node scripts/calculate-scores-v2.js --critical

      - name: Export leaderboard snapshots after scoring
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
          FORCE_ALL_LEADERBOARD_SNAPSHOTS: '1'
        run: node scripts/export-snapshots.js leaderboards

      - name: Verify scoring snapshots after scoring
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
          FORCE_ALL_LEADERBOARD_SNAPSHOTS: '1'
          SCORING_REQUIRE_SCORE_HEARTBEAT_AFTER_RESULT: '1'
          SCORING_SCORE_FRESH_AFTER: ${{ steps.score_results.outputs.score_fresh_after }}
        run: node scripts/verify-scoring-snapshots.js

      - name: Audit two-phase knockout scoring after scoring
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/audit-two-phase-knockout-scoring.js

      - name: Refresh FIFA schedule after verified result
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/update-fifa-world-cup-schedule.js

      - name: Bridge next knockout fixtures after verified result
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync-fifa-schedule-to-matches.js --include-placeholders --fail-missing-known-within-hours=36

      - name: Export match snapshot after fixture bridge
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Generate knockout scoring scenarios
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_VERBOSE: '0'
        run: node scripts/generate-knockout-scenarios.js

      - name: Commit critical scoring snapshots if changed
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
          FORCE_ALL_LEADERBOARD_SNAPSHOTS: '1'
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
          REGENERATE_COMMANDS: |
            node scripts/update-fifa-world-cup-schedule.js || true
            node scripts/sync-fifa-schedule-to-matches.js --include-placeholders --fail-missing-known-within-hours=36 || true
            node scripts/export-snapshots.js matches
            SCORING_FORCE_SCORE_HEARTBEAT=1 node scripts/calculate-scores-v2.js --critical
            node scripts/export-snapshots.js leaderboards
            SCORING_REQUIRE_SCORE_HEARTBEAT_AFTER_RESULT=1 SCORING_SCORE_FRESH_AFTER="${{ steps.score_results.outputs.score_fresh_after }}" node scripts/verify-scoring-snapshots.js
            node scripts/audit-two-phase-knockout-scoring.js
            node scripts/generate-knockout-scenarios.js || true
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/world-cup-schedule.json public-data/matches.json public-data/leaderboard public-data/knockout-scenarios)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: refresh scores after verified result" public-data/world-cup-schedule.json public-data/matches.json public-data/leaderboard public-data/knockout-scenarios
          else
            echo "no scoring snapshot change"
          fi

      - name: Prove public scoring snapshots after verified result
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
          FORCE_ALL_LEADERBOARD_SNAPSHOTS: '1'
          SCORING_REQUIRE_SCORE_HEARTBEAT_AFTER_RESULT: '1'
          SCORING_SCORE_FRESH_AFTER: ${{ steps.score_results.outputs.score_fresh_after }}
          SCORING_SNAPSHOT_PUBLIC_BASE_URL: https://friendlybet.live
          SCORING_SNAPSHOT_PUBLIC_RETRIES: 60
          SCORING_SNAPSHOT_PUBLIC_RETRY_MS: 10000
        run: node scripts/verify-scoring-snapshots.js

      - name: Check knockout scenario readiness
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KNOCKOUT_SCENARIO_FAIL_WITHIN_HOURS: 24
        run: node scripts/knockout-scenario-readiness.js

      - name: Generate leaderboard banter after critical scoring
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/generate-banter.js

      - name: Build Pundit feed after critical scoring
        id: pundit_build
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/generate-pundit.js

      - name: Validate Pundit feed after critical scoring
        id: pundit_validation
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/test-pundit-feed.js

      - name: Report post-final Pundit warning
        if: steps.verify_results.outputs.changed == 'true' && (steps.pundit_build.outcome == 'failure' || steps.pundit_validation.outcome == 'failure')
        run: |
          echo "::warning::Post-final Pundit refresh failed or did not pass quality validation. Critical result/scoring publication is already isolated; keeping the last committed content feed."

      - name: Commit post-final content if changed
        if: steps.verify_results.outputs.changed == 'true' && steps.pundit_build.outcome == 'success' && steps.pundit_validation.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REGENERATE_COMMANDS: |
            node scripts/generate-banter.js || true
            node scripts/generate-pundit.js
            node scripts/test-pundit-feed.js
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/banter public-data/banter-state.json public-data/pundit.json)" ]; then
            bash scripts/commit-generated-snapshots.sh "content: refresh post-final feed" public-data/banter public-data/banter-state.json public-data/pundit.json
          else
            echo "no post-final content change"
          fi

      - name: Validate existing World Cup stories
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/test-world-cup-stories.js

      - name: Check for World Cup story work
        id: story_work
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/publish-world-cup-stories-auto.js

      - name: Commit World Cup stories if changed
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          REGENERATE_COMMANDS: |
            node scripts/export-snapshots.js matches
            node scripts/publish-world-cup-stories-auto.js
            node scripts/test-world-cup-stories.js
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/world-cup-stories.json story-assets)" ]; then
            bash scripts/commit-generated-snapshots.sh "story: auto-publish World Cup story" public-data/world-cup-stories.json story-assets
          else
            echo "no World Cup story change"
          fi

      - name: Live-state watchdog
        if: steps.verify_results.outputs.changed == 'true' || steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LIVE_WATCHDOG_SOURCE: supabase
          # Result/scoring publication is the critical path. Story/news debt is
          # warned/escalated separately so users still get points and knockout access.
          LIVE_WATCHDOG_REQUIRE_NEWS: '0'
          LIVE_WATCHDOG_SKIP_STORIES: '1'
        run: node scripts/live-state-watchdog.js

      - name: Escalate unresolved result work
        if: always() && (steps.verify_results.outputs.needs_attention == 'true' || (steps.story_work.outputs.unprepared_count != '' && steps.story_work.outputs.unprepared_count != '0'))
        run: |
          failed=0
          if [ "${{ steps.verify_results.outputs.needs_attention }}" = "true" ]; then
            echo "::error::Final-result verifier still has unresolved candidates. checked=${{ steps.verify_results.outputs.checked }} updated=${{ steps.verify_results.outputs.updated }} skipped=${{ steps.verify_results.outputs.skipped }} unavailable=${{ steps.verify_results.outputs.unavailable }}"
            failed=1
          fi
          if [ "${{ steps.story_work.outputs.unprepared_count }}" != "" ] && [ "${{ steps.story_work.outputs.unprepared_count }}" != "0" ]; then
            echo "::warning::World Cup story desk has ${{ steps.story_work.outputs.unprepared_count }} finished match(es) without prepared publishable story assets."
          fi
          exit "$failed"
