name: Live Match Poller

# Near-real-time live scores. During the full group-stage window it runs every
# 5 min (GitHub's minimum); the script preflights first and calls providers only
# when a match is actually active or just finished. When a match is live it polls
# ESPN every ~60s for ~4.5 min, writing ONLY to the DB (no snapshot commit ->
# ZERO Vercel deploys). The client reads live scores straight from the DB during play.
on:
  schedule:
    # Continuous coverage removes missed-window risk from delayed kickoffs or
    # incorrect schedule rows; smart preflight is the cost control.
    # Offset from :00/:05/... because GitHub may delay or drop high-load cron edges.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * 11-28 6 *'
  workflow_dispatch:

# Don't let two live-poller runs overlap (a slow run + the next cron launch).
concurrency:
  group: live-poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Poll live matches into the DB
        id: live_poll
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/live-poller.js
          else
            node scripts/live-poller.js
          fi

      - name: Verify final immediately after ESPN full time
        id: verify_results
        if: steps.live_poll.outputs.final_detected == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_FALLBACK_MIN_AGE_MINUTES: 80
          RESULT_FALLBACK_MIN_SOURCES: 2
          RESULT_FALLBACK_REQUIRED_SOURCES: espn,fifa
          RESULT_FALLBACK_SOURCES: espn,fifa
          RESULT_FALLBACK_SOURCE_MODE: all
          RESULT_FALLBACK_OBSERVATION_TTL_MINUTES: 180
          RESULT_VERIFICATION_REPORT_PATH: artifacts/live-final-verification-report.json
        run: node scripts/final-result-verifier.js --apply

      - name: Upload live final verification report
        if: always() && steps.verify_results.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: live-final-verification-report
          path: artifacts/live-final-verification-report.json
          if-no-files-found: warn

      - name: Export match snapshot after verified final
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Calculate scores after verified final
        if: steps.verify_results.outputs.changed == 'true'
        timeout-minutes: 35
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
        run: node scripts/calculate-scores-v2.js

      - name: Export leaderboard snapshots after scoring
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/export-snapshots.js leaderboards

      - name: Verify scoring snapshots after scoring
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/verify-scoring-snapshots.js

      - name: Generate leaderboard banter after scoring
        if: steps.verify_results.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/generate-banter.js

      - name: Build Pundit feed after verified final
        if: steps.verify_results.outputs.changed == 'true'
        run: node scripts/generate-pundit.js

      - name: Validate Pundit feed after verified final
        if: steps.verify_results.outputs.changed == 'true'
        run: node scripts/test-pundit-feed.js

      - name: Commit live final snapshots if changed
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
          REGENERATE_COMMANDS: |
            node scripts/export-snapshots.js matches
            node scripts/calculate-scores-v2.js
            node scripts/export-snapshots.js leaderboards
            node scripts/verify-scoring-snapshots.js
            node scripts/generate-banter.js || true
            node scripts/generate-pundit.js
            node scripts/test-pundit-feed.js
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/matches.json public-data/leaderboard public-data/banter public-data/banter-state.json public-data/pundit.json)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: refresh live final result" public-data/matches.json public-data/leaderboard public-data/banter public-data/banter-state.json public-data/pundit.json
          else
            echo "no live final snapshot change"
          fi

      - name: Validate existing World Cup stories
        if: steps.verify_results.outputs.changed == 'true'
        run: node scripts/test-world-cup-stories.js

      - name: Check for World Cup story work
        id: story_work
        if: steps.verify_results.outputs.changed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/publish-world-cup-stories-auto.js

      - name: Commit live story if changed
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          REGENERATE_COMMANDS: |
            node scripts/export-snapshots.js matches
            node scripts/publish-world-cup-stories-auto.js
            node scripts/test-world-cup-stories.js
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/world-cup-stories.json story-assets)" ]; then
            bash scripts/commit-generated-snapshots.sh "story: publish live World Cup story" public-data/world-cup-stories.json story-assets
          else
            echo "no live World Cup story change"
          fi

      - name: Live-state watchdog
        if: steps.verify_results.outputs.changed == 'true' || steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LIVE_WATCHDOG_SOURCE: supabase
          # Result/scoring publication is the critical path. Story/news debt is
          # warned/escalated separately so users still get points and knockout access.
          LIVE_WATCHDOG_REQUIRE_NEWS: '0'
          LIVE_WATCHDOG_SKIP_STORIES: '1'
        run: node scripts/live-state-watchdog.js

      - name: Escalate unresolved live final work
        if: always() && (steps.verify_results.outputs.needs_attention == 'true' || (steps.story_work.outputs.unprepared_count != '' && steps.story_work.outputs.unprepared_count != '0'))
        run: |
          failed=0
          if [ "${{ steps.verify_results.outputs.needs_attention }}" = "true" ]; then
            echo "::error::Live-poller saw ESPN full time, but final verification still has unresolved candidates. checked=${{ steps.verify_results.outputs.checked }} updated=${{ steps.verify_results.outputs.updated }} skipped=${{ steps.verify_results.outputs.skipped }} unavailable=${{ steps.verify_results.outputs.unavailable }}"
            failed=1
          fi
          if [ "${{ steps.story_work.outputs.unprepared_count }}" != "" ] && [ "${{ steps.story_work.outputs.unprepared_count }}" != "0" ]; then
            echo "::warning::World Cup story desk has ${{ steps.story_work.outputs.unprepared_count }} finished match(es) without prepared publishable story assets."
          fi
          exit "$failed"
