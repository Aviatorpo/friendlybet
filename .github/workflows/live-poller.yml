name: Live Match Poller

# Near-real-time live scores. During scheduled match windows it runs every
# 5 min (GitHub's minimum); when a match is live it polls ESPN every ~60s for
# ~4.5 min, writing ONLY to the DB (no snapshot commit -> ZERO Vercel deploys).
# The client reads live scores straight from the DB during play.
on:
  schedule:
    # UTC windows generated from public-data/matches.json for known group-stage
    # kickoffs. Each window covers roughly kickoff-15m through kickoff+3h.
    - cron: '*/5 15-23 18 6 *'
    - cron: '*/5 0-4,18-23 19 6 *'
    - cron: '*/5 0-6,16-23 20 6 *'
    - cron: '*/5 0-7,15-23 21 6 *'
    - cron: '*/5 0-4,16-23 22 6 *'
    - cron: '*/5 0-6,16-23 23 6 *'
    - cron: '*/5 0-5,18-23 24 6 *'
    - cron: '*/5 0-4,19-23 25 6 *'
    - cron: '*/5 0-5,18-23 26 6 *'
    - cron: '*/5 0-6,20-23 27 6 *'
    - cron: '*/5 0-5 28 6 *'
  workflow_dispatch:

# Don't let two live-poller runs overlap (a slow run + the next cron launch).
concurrency:
  group: live-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll live matches into the DB
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/live-poller.js || { echo "::warning::live-poller skipped after transient Supabase/ESPN failure"; exit 0; }
          else
            node scripts/live-poller.js
          fi
