name: Publish Prepared World Cup Stories

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - world-cup-story-publish

permissions:
  contents: write

concurrency:
  group: publish-world-cup-stories-prepared
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Export match snapshot
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/export-snapshots.js matches

      - name: Check for prepared World Cup story work
        id: story_work
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish and commit prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          pushed=0
          for a in 1 2 3 4 5; do
            echo "story publish push attempt $a"
            git fetch origin main
            git reset --hard origin/main

            node scripts/export-snapshots.js matches
            node scripts/publish-world-cup-stories-auto.js

            if [ -z "$(git status --porcelain public-data/matches.json public-data/world-cup-stories.json story-assets)" ]; then
              echo "no prepared World Cup story change"
              pushed=1
              break
            fi

            git add public-data/matches.json public-data/world-cup-stories.json story-assets
            git commit -q -m "story: publish prepared World Cup story"

            if git push; then
              pushed=1
              break
            fi

            echo "push retry $a"
            sleep 4
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::failed to push prepared World Cup stories after clean retries"
            exit 1
          fi
