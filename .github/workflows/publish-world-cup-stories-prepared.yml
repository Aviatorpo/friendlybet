name: Publish Prepared World Cup Stories

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - world-cup-story-publish

permissions:
  contents: write

concurrency:
  group: publish-world-cup-stories-prepared
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Export match snapshot
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Check for prepared World Cup story work
        id: story_work
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/publish-world-cup-stories-auto.js

      - name: Commit prepared World Cup stories if changed
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          REGENERATE_COMMANDS: |
            node scripts/world-cup-story-auto-needed.js
            node scripts/publish-world-cup-stories-auto.js
            node scripts/test-world-cup-stories.js
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/matches.json public-data/world-cup-stories.json story-assets)" ]; then
            bash scripts/commit-generated-snapshots.sh "story: publish prepared World Cup story" public-data/matches.json public-data/world-cup-stories.json story-assets
          else
            echo "no prepared World Cup story change"
          fi
