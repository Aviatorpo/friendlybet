name: Manual Match Results

on:
  workflow_dispatch:
    inputs:
      results_json:
        description: 'JSON array: [{"home":"ENG","away":"CRO","home_score":4,"away_score":2,"winner":"ENG"}]'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: calculate-scores-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply manual match results
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MANUAL_MATCH_RESULTS_JSON: ${{ inputs.results_json }}
        run: node scripts/manual-match-results.js

      - name: Export match snapshot immediately after manual result
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Commit match snapshot before scoring
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          REGENERATE_COMMANDS: |
            node scripts/export-snapshots.js matches
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/matches.json)" ]; then
            bash scripts/commit-generated-snapshots.sh "data: publish manual match result" public-data/matches.json
          else
            echo "no immediate match snapshot change"
          fi

      - name: Calculate scores (v2)
        id: score_results
        timeout-minutes: 25
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_SUPABASE_FETCH_TIMEOUT_MS: 30000
          SCORING_VERBOSE: '0'
        run: node scripts/calculate-scores-v2.js --critical

      - name: Export critical CDN snapshots
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
        run: node scripts/export-snapshots.js all

      - name: Verify scoring snapshots
        if: steps.score_results.outputs.changed_pool_ids != ''
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
        run: node scripts/verify-scoring-snapshots.js

      - name: Refresh FIFA schedule after manual result
        continue-on-error: true
        run: node scripts/update-fifa-world-cup-schedule.js

      - name: Bridge next knockout fixtures after manual result
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync-fifa-schedule-to-matches.js --include-placeholders --fail-missing-known-within-hours=36

      - name: Export match snapshot after fixture bridge
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FORCE_MATCH_SNAPSHOT: '1'
        run: node scripts/export-snapshots.js matches

      - name: Generate knockout scoring scenarios
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCORING_VERBOSE: '0'
        run: node scripts/generate-knockout-scenarios.js

      - name: Commit critical result data if changed
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/world-cup-schedule.json public-data/matches.json public-data/leaderboard public-data/knockout-scenarios)" ]; then
            git add public-data/world-cup-schedule.json public-data/matches.json public-data/leaderboard public-data/knockout-scenarios
            git commit -q -m "data: apply manual match results"
            git pull --rebase --autostash
            git push
          else
            echo "no critical public-data change"
          fi

      - name: Check knockout scenario readiness
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KNOCKOUT_SCENARIO_FAIL_WITHIN_HOURS: 24
        run: node scripts/knockout-scenario-readiness.js

      - name: Prove public scoring snapshots after manual result
        if: steps.score_results.outputs.changed_pool_ids != ''
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADERBOARD_POOL_IDS: ${{ steps.score_results.outputs.changed_pool_ids }}
          SCORING_SNAPSHOT_PUBLIC_BASE_URL: https://friendlybet.live
          SCORING_SNAPSHOT_PUBLIC_RETRIES: 12
          SCORING_SNAPSHOT_PUBLIC_RETRY_MS: 10000
        run: node scripts/verify-scoring-snapshots.js

      - name: Generate leaderboard banter after manual results
        continue-on-error: true
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/generate-banter.js

      - name: Build Pundit feed after manual results
        continue-on-error: true
        run: node scripts/generate-pundit.js

      - name: Validate Pundit feed after manual results
        continue-on-error: true
        run: node scripts/test-pundit-feed.js

      - name: Validate World Cup stories
        continue-on-error: true
        run: node scripts/test-world-cup-stories.js

      - name: Commit post-manual content if changed
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/banter public-data/banter-state.json public-data/pundit.json)" ]; then
            git add public-data/banter public-data/banter-state.json public-data/pundit.json
            git commit -q -m "content: refresh manual-result feed"
            git pull --rebase --autostash
            git push
          else
            echo "no post-manual content change"
          fi

      - name: Check for World Cup story work
        id: story_work
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/world-cup-story-auto-needed.js

      - name: Install story image tooling
        if: steps.story_work.outputs.publishable == 'true'
        run: python3 -m pip install --user pillow pypdf

      - name: Publish prepared World Cup stories
        if: steps.story_work.outputs.publishable == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/publish-world-cup-stories-auto.js

      - name: Commit World Cup stories if changed
        if: steps.story_work.outputs.publishable == 'true'
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data/world-cup-stories.json story-assets)" ]; then
            git add public-data/world-cup-stories.json story-assets
            git commit -q -m "story: auto-publish World Cup story"
            git pull --rebase --autostash
            git push
          else
            echo "no World Cup story change"
          fi
