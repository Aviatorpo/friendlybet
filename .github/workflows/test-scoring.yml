name: Test Scoring & Sync

# Runs the deterministic tests (no DB / no secrets) so changes to the scoring
# engine or the live-match sync window are guarded against regressions.
on:
  push:
    paths:
      - 'scripts/calculate-scores-v2.js'
      - 'scripts/test-scoring.js'
      - 'scripts/smart-sync.js'
      - 'scripts/test-smart-sync.js'
      - 'scripts/test-sync-transform.js'
      - 'scripts/test-team-mapping.js'
      - 'scripts/live-poller.js'
      - 'scripts/test-live-poller.js'
      - 'scripts/api-football-fallback.js'
      - 'scripts/test-api-football-fallback.js'
      - 'scripts/generate-banter.js'
      - 'scripts/test-banter.js'
      - '.github/workflows/test-scoring.yml'
  pull_request:
    paths:
      - 'scripts/calculate-scores-v2.js'
      - 'scripts/test-scoring.js'
      - 'scripts/smart-sync.js'
      - 'scripts/test-smart-sync.js'
      - 'scripts/test-sync-transform.js'
      - 'scripts/test-team-mapping.js'
      - 'scripts/live-poller.js'
      - 'scripts/test-live-poller.js'
      - 'scripts/api-football-fallback.js'
      - 'scripts/test-api-football-fallback.js'
      - 'scripts/generate-banter.js'
      - 'scripts/test-banter.js'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Destructive-SQL guard (no unguarded TRUNCATE / blanket DELETE on user data)
        run: node scripts/check-destructive-sql.js
      - name: Run scoring tests
        run: node scripts/test-scoring.js
      - name: Run smart-sync window tests
        run: node scripts/test-smart-sync.js
      - name: Run sync transform tests
        run: node scripts/test-sync-transform.js
      - name: Run team-mapping tests
        run: node scripts/test-team-mapping.js
      - name: Run live-poller tests
        run: node scripts/test-live-poller.js

      - name: Run API-Football fallback tests
        run: node scripts/test-api-football-fallback.js
      - name: Run banter engine tests
        run: node scripts/test-banter.js
