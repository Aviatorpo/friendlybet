jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Destructive-SQL guard (no unguarded TRUNCATE / blanket DELETE on user data)
        run: node scripts/check-destructive-sql.js
      - name: Run scoring tests
        run: node scripts/test-scoring.js
      - name: Run knockout scenario tests
        run: node scripts/test-knockout-scenarios.js
      - name: Run FIFA bracket tests
        run: node scripts/test-fifa-bracket.js
      - name: Run FIFA third-place allocation tests
        run: node scripts/test-third-place-allocation.js
      - name: Run two-phase knockout wiring tests
        run: node scripts/test-two-phase-knockout-wiring.js
      - name: Run World Cup rules tests
        run: node scripts/test-world-cup-rules.js
      - name: Run fair-play resolver tests
        run: node scripts/test-fair-play-resolver.js
      - name: Run smart-sync window tests
        run: node scripts/test-smart-sync.js
      - name: Run FIFA schedule-to-scoring bridge tests
        run: node scripts/test-sync-fifa-schedule-to-matches.js
      - name: Run FIFA schedule stage-normalization tests
        run: node scripts/test-update-fifa-world-cup-schedule.js
      - name: Run sync transform tests
        run: node scripts/test-sync-transform.js
      - name: Run recovery login resilience tests
        run: node scripts/test-recovery-login-resilience.js
      - name: Run team-mapping tests
        run: node scripts/test-team-mapping.js
      - name: Run live-poller tests
        run: node scripts/test-live-poller.js
      - name: Run live-controller preflight tests
        run: node scripts/test-live-controller-needed.js
      - name: Run live-controller state tests
        run: node scripts/test-live-controller-state.js
      - name: Run live-nudge API tests
        run: node scripts/test-live-nudge-api.mjs
      - name: Run live-state watchdog tests
        run: node scripts/test-live-state-watchdog.js
      - name: Run live-ops audit tests
        run: node scripts/test-live-ops-audit.js
      - name: Run live-ops snapshot audit
        env:
          LIVE_OPS_IGNORE_SNAPSHOT_LIVE_STATUS: '1'
          # App/scoring hotfix CI must not be blocked by accepted story backlog.
          # Dedicated content/readiness workflows still report missing Stories/Pundit.
          LIVE_OPS_ALLOW_STORY_BACKLOG: '1'
          LIVE_OPS_SKIP_PUNDIT: '1'
        run: node scripts/live-ops-audit.js
      - name: Run live completion readiness gate
        env:
          LIVE_COMPLETION_ALLOW_STORY_BACKLOG: '1'
          LIVE_COMPLETION_SKIP_PUNDIT: '1'
        run: node scripts/live-completion-readiness.js
      - name: Run live completion readiness tests
        run: node scripts/test-live-completion-readiness.js
      - name: Run live ops summary tests
        run: node scripts/test-live-ops-summary.js
      - name: Run tournament context tests
        run: node scripts/test-tournament-context.js
      - name: Run live UX state tests
        run: node scripts/test-live-ux-state.js
      - name: Run match display-state tests
        run: node scripts/test-match-display-state.js
      - name: Run snapshot export tests
        run: node scripts/test-export-snapshots.js
      - name: Run scoring snapshot verifier tests
        run: node scripts/test-verify-scoring-snapshots.js
      - name: Run ESPN live-sync tests
        run: node scripts/test-espn-live-sync.js

      - name: Run final-result verifier preflight tests
        run: node scripts/test-final-result-verifier-needed.js
      - name: Run final-result verifier tests
        run: node scripts/test-final-result-verifier.js
      - name: Run final-result verifier ledger tests
        run: node scripts/test-final-result-verifier-ledger.js
      - name: Run final-result verifier fallback tests
        run: node scripts/test-final-result-verifier-fallback.js
      - name: Run final-result verifier auto-emergency tests
        run: node scripts/test-final-result-verifier-auto-emergency.js
      - name: Run chairman final truth override tests
        run: node scripts/test-chairman-final-truth-override.js
      - name: Run pool final preview tests
        run: node scripts/test-pool-final-preview.js
      - name: Run banter engine tests
        run: node scripts/test-banter.js
      - name: Run Pundit feed tests
        run: node scripts/test-pundit-feed.js
      - name: Run World Cup story tests
        run: node scripts/test-world-cup-stories.js
      - name: Run Pundit news validation tests
        run: node scripts/test-pundit-news-validate.js
      - name: Validate current Pundit news file
        run: node scripts/pundit-news-validate.js
      - name: Run Pundit live-state generation tests
        run: node scripts/test-generate-pundit-live-state.js
      - name: Run Pundit live-window certification tests
        run: node scripts/test-pundit-live-window-certifier.js
      - name: Run Pundit client staleness tests
        run: node scripts/test-pundit-client-staleness.js
      - name: Run locked invite recovery tests
        run: node scripts/test-locked-invite-recovery.js
