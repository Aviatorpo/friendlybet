name: Smart Match Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize sync runs so the snapshot commit/push can't race a second run.
concurrency:
  group: smart-sync
  cancel-in-progress: false

jobs:
  smart-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run smart sync
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/smart-sync.js

      # Pillar 1: refresh the CDN match snapshot so clients read it from the edge
      # instead of hitting Postgres on every 60s poll during live matches.
      # NOTE: export-snapshots FREEZES matches.json while any match is live (the
      # client reads live scores from the DB during play), so this step is a
      # no-op mid-match - that's what keeps a busy WC day under Vercel's
      # 100-deploys/day cap. It commits the final/schedule data once play settles.
      - name: Export match snapshot
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/export-snapshots.js matches

      - name: Commit snapshot if changed
        run: |
          git config user.name "Aviatorpo"
          git config user.email "283137823+Aviatorpo@users.noreply.github.com"
          if [ -n "$(git status --porcelain public-data)" ]; then
            git add public-data
            git commit -q -m "data: refresh match snapshot"
            pushed=0
            for a in 1 2 3; do
              if git pull --rebase --autostash && git push; then pushed=1; break; fi
              echo "push retry $a"; sleep 4
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push match snapshot after 3 retries"
              exit 1
            fi
          else
            echo "no snapshot change"
          fi
