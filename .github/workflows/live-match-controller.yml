name: Live Match Controller

# Backup lane for live match completion. The 5-minute live poller remains the
# fast path; this controller is a long-running watcher with its own concurrency
# group, so a dropped short cron does not leave users waiting for Eyal to notice.
on:
  schedule:
    - cron: '1,21,41 * 11-30 6 *'
    - cron: '1,21,41 * 1-19 7 *'
  workflow_dispatch:
    inputs:
      controller_minutes:
        description: 'How long the controller should stay awake'
        required: true
        default: '80'
        type: choice
        options:
          - '40'
          - '80'
          - '120'

concurrency:
  group: live-match-controller
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Check whether a live controller is needed
        id: controller_needed
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LIVE_CONTROLLER_LEAD_MINUTES: '120'
          LIVE_CONTROLLER_LOOKBACK_MINUTES: '240'
        run: node scripts/live-controller-needed.js

      - name: Watch live match window
        id: live_poll
        if: steps.controller_needed.outputs.needed == 'true'
        env:
          SUPABASE_URL: https://kovhuahdoluxyqqwqohw.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CONTROLLER_MINUTES: ${{ inputs.controller_minutes || '120' }}
          LIVE_CONTROLLER_SOURCE: github-long-controller
          LIVE_CONTROLLER_COOLDOWN_MS: '45000'
          LIVE_POLL_INTERVAL_MS: '60000'
          LIVE_POLL_RUN_MS: '270000'
          LIVE_POLL_CONTROLLER_SLEEP_MS: '30000'
          LIVE_POLL_CONTROLLER_IDLE_SLEEP_MS: '120000'
        run: |
          LIVE_POLL_CONTROLLER_MS=$((CONTROLLER_MINUTES * 60 * 1000)) node scripts/live-poller.js

      - name: Dispatch verified final scoring pipeline
        if: steps.live_poll.outputs.final_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run final-result-verifier.yml \
            --ref main \
            -f apply=true \
            -f lookback_hours=336 \
            -f backoff=0 \
            -f emergency_sources=true

      - name: Report controller idle
        if: steps.controller_needed.outputs.needed != 'true'
        run: echo "No live/upcoming non-terminal match needs the controller. detail=${{ steps.controller_needed.outputs.detail }}"
