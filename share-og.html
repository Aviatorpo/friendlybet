<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>FriendlyBet OG card</title>
<!-- Internal OG-card template (design prototype for a future per-user dynamic
     OG endpoint). Not linked from anywhere in production; kept out of search. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:'Heebo',sans-serif;color:#f3efe7;position:relative;
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(217,180,106,.20), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(217,180,106,.08), transparent 60%),
      #0b0a08;}
  .frame{position:absolute;inset:0;padding:46px 60px;display:flex;flex-direction:column}
  /* header */
  .head{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{width:52px;height:52px;border-radius:13px;background:linear-gradient(140deg,#d9b46a,#8a6d35);
    display:grid;place-items:center;font-size:30px;box-shadow:0 8px 24px rgba(217,180,106,.3)}
  .brand b{font-family:'Sora',sans-serif;font-weight:800;font-size:30px;letter-spacing:.3px}
  .head .meta{text-align:left;font-family:'Sora',sans-serif}
  html[dir=rtl] .head .meta{text-align:right}
  .head .meta .who{font-weight:800;font-size:24px;color:#d9b46a}
  .head .meta .ev{font-size:14px;letter-spacing:3px;color:#a39c8c;font-weight:700;margin-top:3px}

  /* center: the final */
  .final{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;margin-top:8px}
  .side{display:flex;flex-direction:column;align-items:center;gap:20px;width:340px;position:relative;padding:26px 10px;border-radius:24px}
  .side.win{background:linear-gradient(180deg,rgba(217,180,106,.16),rgba(217,180,106,.02));
    box-shadow:inset 0 0 0 2px rgba(217,180,106,.5)}
  .side .ribbon{position:absolute;top:-20px;font-family:'Sora',sans-serif;font-weight:800;font-size:17px;
    letter-spacing:2px;color:#0b0a08;background:linear-gradient(140deg,#f0d699,#d9b46a);
    padding:8px 22px;border-radius:30px;box-shadow:0 8px 22px rgba(217,180,106,.4);white-space:nowrap}
  .side .crown{position:absolute;top:-66px;font-size:48px;filter:drop-shadow(0 6px 14px rgba(217,180,106,.6))}
  .side .fl{width:248px;height:165px;object-fit:cover;border-radius:16px;
    box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)}
  .side.win .fl{box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 4px rgba(217,180,106,.5)}
  .side .nm{font-family:'Sora',sans-serif;font-weight:800;font-size:40px;text-align:center;line-height:1}
  .side .fl-none{width:248px;height:165px;border-radius:16px;display:grid;place-items:center;background:#211d17;color:#a39c8c;font-size:40px;font-weight:800}
  .vs{font-family:'Sora',sans-serif;font-weight:800;font-size:46px;color:#6f6857}

  /* footer */
  .foot{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
  .foot .tag{font-size:21px;font-weight:700;color:#cdbf9f}
  .foot .url{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:#d9b46a}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script src="/share-assets/fifa-third-place-table.js"></script>
<script src="/share-assets/world-cup-rules.js"></script>
<script src="/share-assets/share-core.js"></script>
<script>
function param(k){ return new URLSearchParams(location.search).get(k); }
const STR = {
  he:{ ev:'מונדיאל 2026 · הגמר', champ:'אלופה', tag:'התחזית שלי. מה שלך?', myFinal:'הגמר שלי' },
  en:{ ev:'WORLD CUP 2026 · FINAL', champ:'CHAMPION', tag:'My call. What is yours?', myFinal:'My Final' }
};
function build(picks){
  const S = window.FBShare;
  const lang = picks.lang || 'he';
  const T = STR[lang] || STR.he;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==='he')?'rtl':'ltr';
  const tn = c => S.teamName(c, lang);
  const champ = picks.tournamentWinner || (picks.bracketPicks||{})[31];
  const fin = S.resolveBracket(picks).final;
  const flBig = (code) => {
    const url = S.flagUrl(code);
    return url ? `<img class="fl" src="${url}" alt="">` : `<div class="fl-none">${code||'?'}</div>`;
  };
  const side = (code) => {
    const win = code === champ;
    return `<div class="side ${win?'win':''}">
      ${win?`<div class="crown">🏆</div><div class="ribbon">${T.champ}</div>`:''}
      ${flBig(code)}
      <div class="nm">${code?tn(code):'—'}</div>
    </div>`;
  };
  document.getElementById('frame').innerHTML = `
    <div class="head">
      <div class="brand"><div class="logo">⚽</div><b>FriendlyBet</b></div>
      <div class="meta"><div class="who">${picks.nickname} · ${T.myFinal}</div><div class="ev">${T.ev}</div></div>
    </div>
    <div class="final">
      ${side(fin.home)}
      <div class="vs">VS</div>
      ${side(fin.away)}
    </div>
    <div class="foot">
      <div class="tag">${T.tag}</div>
      <div class="url">friendlybet.live</div>
    </div>`;
}
(function(){
  const lang = (param('lang')==='en')?'en':'he';
  build(window.FBShare.buildDemoPicks(lang));
})();
</script>
</body>
</html>
