      <polygon id="rimPent512" points="0,-80 35.19,-105.57 21.76,-146.93 -21.76,-146.93 -35.19,-105.57"/>
      <use href="#rimPent512" transform="rotate(72)"/>
      <use href="#rimPent512" transform="rotate(144)"/>
      <use href="#rimPent512" transform="rotate(216)"/>
      <use href="#rimPent512" transform="rotate(288)"/>
    </g>

    <!-- Central pentagon (r_c=50) -->
    <polygon points="0,-50 47.55,-15.45 29.39,40.45 -29.39,40.45 -47.55,-15.45" fill="#0a1628"/>
  </g>
</svg>
