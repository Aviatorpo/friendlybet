<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2942"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="ballGrad512" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f1f1f1"/>
      <stop offset="100%" stop-color="#c2c2c2"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg512)" rx="96"/>

  <circle cx="256" cy="256" r="203" fill="#d4a853" opacity="0.10"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#d4a853" stroke-width="5" opacity="0.55"/>

  <g transform="translate(256, 256)">
    <circle r="165" fill="url(#ballGrad512)" stroke="#0a1628" stroke-width="8"/>

    <!-- Five rim pentagons (r_o=37, D=117) -->
