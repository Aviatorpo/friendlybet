<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The page is already dark by design. Declaring the scheme tells aggressive
     "force dark" modes (e.g. Brave) NOT to auto-invert/lighten our content —
     without it Brave recolours the flag SVGs (Germany's black stripe turns
     white -> the flag looks wrong). -->
<meta name="color-scheme" content="dark">
<title>התחזית שלי למונדיאל 2026 · FriendlyBet</title>

<!-- PROTOTYPE / LOCAL ONLY. Per-user share pages are kept noindex on purpose:
     they are made to be SHARED (viral), not indexed. Indexing thousands of
     near-identical pick pages risks a "scaled content" quality hit. Flip to
     index only if/when these become aggregate, unique-value pages. -->
<meta name="robots" content="noindex, follow">

<!-- Open Graph / social card. /api/share injects a per-user /api/og image into
     these tags before WhatsApp/Facebook/X scrape the page. The static value is
     only a no-query fallback. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FriendlyBet">
<meta property="og:title" content="התחזית שלי למונדיאל 2026 ⚽ FriendlyBet">
<meta property="og:description" content="בנה חינם את התחזית שלך למונדיאל 2026, צרף חברים ותראו מי באמת מבין בכדורגל.">
<meta property="og:image" content="https://friendlybet.live/og-image-he.png">
<meta property="og:image:secure_url" content="https://friendlybet.live/og-image-he.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://friendlybet.live/og-image-he.png">

<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    color-scheme:dark; /* opt out of browser force-dark recolouring (Brave flag bug) */
    --gold:#d9b46a; --gold-dim:#b8985a; --ink:#0b0a08;
    --card:#15130f; --card2:#1c1913; --line:rgba(217,180,106,.18);
    --text:#f3efe7; --muted:#a39c8c;
  }
  html,body{
    font-family:'Heebo',-apple-system,sans-serif;
    background:
      radial-gradient(820px 560px at 50% -8%, rgba(217,180,106,.13), transparent 62%),
      radial-gradient(700px 560px at 50% 112%, rgba(217,180,106,.05), transparent 60%),
      var(--ink);
    color:var(--text); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:22px 16px 60px}
  .brandbar{display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:22px}
  .brandbar .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--gold),#8a6d35);
    display:grid;place-items:center;font-size:17px;box-shadow:0 4px 16px rgba(217,180,106,.25)}
  .brandbar b{font-family:'Sora',sans-serif;font-weight:800;letter-spacing:.3px;font-size:17px}
  .brandbar span{color:var(--muted);font-size:12px;font-weight:500}

  h1.title{font-family:'Sora',sans-serif;font-weight:800;font-size:23px;text-align:center;line-height:1.3}
  h1.title .who{color:var(--gold)}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-top:6px;margin-bottom:24px}

  .section-label{display:flex;align-items:center;gap:10px;margin:30px 4px 13px;
    font-size:12px;font-weight:600;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase}
  .section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  html[dir=rtl] .section-label::after{background:linear-gradient(270deg,var(--line),transparent)}

  /* Champion hero */
  .champ{position:relative;border-radius:20px;padding:26px 22px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,#241d10,#15120c);
    border:1px solid rgba(217,180,106,.45);
    box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(217,180,106,.18)}
  .champ::before{content:'';position:absolute;inset:0;
    background:radial-gradient(420px 200px at 50% -20%,rgba(217,180,106,.28),transparent 70%);pointer-events:none}
  .champ .crown{font-size:26px;filter:drop-shadow(0 3px 8px rgba(217,180,106,.5))}
  .champ .kicker{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin:8px 0 14px}
  .champ .flag-xl{width:118px;height:79px;object-fit:cover;border-radius:11px;margin:0 auto;display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4), 0 0 0 4px rgba(217,180,106,.22)}
  .champ .name{font-family:'Sora',sans-serif;font-weight:800;font-size:29px;margin-top:16px}

  /* The final */
  /* The Final: the headline matchup box (both finalists, champion marked). */
  .finalbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 14px}
  .fb-side{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 4px;border-radius:13px;position:relative}
  .fb-side img,.fb-side .fb-flag-none{width:74px;height:50px;object-fit:cover;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.35)}
  .fb-side .fb-name{font-weight:700;font-size:16px;font-family:'Sora',sans-serif;text-align:center}
  .fb-side.win .fb-name{color:var(--gold)}
  .fb-vs{font-family:'Sora',sans-serif;font-weight:800;color:var(--muted);font-size:16px}

  /* Road to the Final: two self-contained lanes (one per finalist) flanking a
     central axis of round labels. Each lane reads top→bottom from semi-final
     down to the last 32, and every step spells out "beat X" under that
     finalist's flag, so each path is unambiguous. */
  .roads{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;padding:14px 9px}
  .lane{display:flex;flex-direction:column;border-radius:13px;padding:0 4px 8px}
  .lane-head{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;position:relative}
  .lane-head img,.lane-head .fb-flag-none{width:62px;height:42px;object-fit:cover;border-radius:8px;
    box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.3)}
  .lane-head .lh-nm{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;text-align:center}
  .lane.is-champ .lh-nm{color:var(--gold)}
  .lane-step{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-top:1px solid rgba(255,255,255,.06)}
  .lane-step .won{font-size:9px;font-weight:600;letter-spacing:.2px;color:var(--muted)}
  .lane-step .opp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;max-width:100%}
  .lane-step .opp img,.lane-step .opp .fb-flag-none{width:23px;height:16px;border-radius:3px;object-fit:cover;flex:none}
  .lane-step .opp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .axis{display:flex;flex-direction:column;align-items:center;position:relative}
  /* One uniform gold line from the "Final" node at the top all the way down
     through every round to the last 32 — the whole road to the final. */
  .axis::before{content:'';position:absolute;left:50%;top:121px;bottom:33px;width:2px;transform:translateX(-50%);
    background:rgba(217,180,106,.5);z-index:0}
  .axis-head{min-height:96px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
  .axis-head .final{font-family:'Sora',sans-serif;font-weight:800;font-size:12px;letter-spacing:.5px;
    color:var(--gold);text-transform:uppercase;background:var(--card);padding:6px 13px;border-radius:20px;
    box-shadow:0 0 0 1px rgba(217,180,106,.55)}
  .axis-step{min-height:50px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:0 2px}
  .axis-step .rnd{font-size:9px;font-weight:700;letter-spacing:.3px;color:var(--gold);text-transform:uppercase;
    background:var(--card);padding:4px 7px;border-radius:20px;box-shadow:0 0 0 1px rgba(217,180,106,.3);
    white-space:nowrap;text-align:center}

  /* Top scorer */
  .scorer{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px 18px}
  .scorer .boot{font-size:26px}
  .scorer .nm{font-family:'Sora',sans-serif;font-weight:700;font-size:18px}
  .scorer .tm{color:var(--muted);font-size:12px;margin-top:2px;display:flex;align-items:center;gap:6px}
  .scorer .tm img,.scorer .tm span.fb-flag-none{width:22px;height:15px;border-radius:3px;object-fit:cover}

  /* Groups */
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:430px){.groups{grid-template-columns:1fr}}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .grp .gh{font-family:'Sora',sans-serif;font-weight:800;color:var(--gold);font-size:13px;margin-bottom:9px}
  .grp .row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
  .grp .row .pos{color:var(--muted);font-weight:700;min-width:14px;font-size:12px}
  .grp .row img,.grp .row span.fb-flag-none{width:24px;height:16px;border-radius:3px;object-fit:cover;flex:none}
  .grp .row.first .nm{font-weight:600}
  .grp .row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp.two-phase .gh{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grp.two-phase .gc{font-family:'Heebo',sans-serif;font-size:11px;font-weight:700;color:var(--muted)}
  .grp.two-phase .row{border-radius:9px;padding:5px 7px;margin:1px -4px}
  .grp.two-phase .row:not(.advancing){opacity:.42}
  .grp.two-phase .row.advancing{background:rgba(217,180,106,.11);box-shadow:inset 0 0 0 1px rgba(217,180,106,.16)}
  .grp.two-phase .row.advancing .pos{color:var(--gold)}
  .grp.two-phase .row.advancing .nm{font-weight:700}

  .locked-panel{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(160deg,#1c1913,#12100b);
    border:1px solid var(--line);border-radius:18px;padding:18px 18px;box-shadow:inset 0 1px 0 rgba(217,180,106,.08)}
  .locked-panel .lock-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
    color:var(--ink);font-weight:900;background:linear-gradient(140deg,var(--gold),#a9853c)}
  .locked-panel h2{font-family:'Sora',sans-serif;font-size:16px;line-height:1.25;margin-bottom:5px}
  .locked-panel p{color:var(--muted);font-size:13px;line-height:1.55}

  /* CTA */
  .cta{margin-top:38px;text-align:center;background:linear-gradient(160deg,#211a0f,#14110b);
    border:1px solid var(--line);border-radius:20px;padding:28px 22px}
  .cta h2{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;margin-bottom:7px}
  .cta p{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
  .cta a{display:inline-block;background:linear-gradient(140deg,var(--gold),#a9853c);color:var(--ink);
    font-weight:800;font-size:15px;text-decoration:none;padding:13px 30px;border-radius:30px;
    box-shadow:0 10px 28px rgba(217,180,106,.3)}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;opacity:.7}
  footer a{color:var(--gold);text-decoration:none}
  .fb-flag-none{display:inline-grid;place-items:center;background:#2a2620;color:var(--muted);font-size:9px;font-weight:700}

  /* Viral share page: trophy image first, then a full horizontal bracket. */
  .share-hero{position:relative;border-radius:22px;overflow:hidden;min-height:clamp(540px,calc(100vh - 190px),690px);background:#0b0a08;
    border:1px solid rgba(217,180,106,.45);box-shadow:0 24px 70px rgba(0,0,0,.56),0 0 0 1px rgba(255,255,255,.04)}
  .share-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;
    filter:saturate(1.04) contrast(1.03)}
  .share-hero::before{content:'';position:absolute;inset:0;background:
    linear-gradient(to bottom,rgba(6,6,4,.18),rgba(6,6,4,0) 24%,rgba(6,6,4,.16) 48%,rgba(6,6,4,.72) 70%,#0b0a08 92%),
    radial-gradient(560px 320px at 50% 42%,rgba(217,180,106,.16),transparent 70%);z-index:1}
  .share-hero-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 18px 22px;text-align:center}
  .share-hero-kicker{font-family:'Sora',sans-serif;font-weight:800;font-size:12px;letter-spacing:3px;color:var(--gold);
    text-transform:uppercase;text-shadow:0 2px 12px #000}
  .share-hero-name{font-family:'Sora',sans-serif;font-weight:800;font-size:34px;line-height:1.05;color:var(--gold);
    margin-top:8px;text-shadow:0 8px 24px rgba(0,0,0,.72)}
  .share-hero-sub{font-size:13px;color:rgba(243,239,231,.72);margin-top:8px}
  .victory-road{display:flex;gap:5px;margin:18px 0 0}
  .victory-road::-webkit-scrollbar{display:none}
  .victory-step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
    border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(217,180,106,.24)}
  .victory-step.final{background:linear-gradient(150deg,rgba(217,180,106,.28),rgba(255,255,255,.07));
    border-color:rgba(217,180,106,.58)}
  .victory-step .rd{font-family:'Sora',sans-serif;font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.5px}
  .victory-step img,.victory-step .fb-flag-none{width:30px;height:20px;border-radius:5px;object-fit:cover}
  .victory-step .nm{font-size:10.5px;font-weight:700;max-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .share-actions{margin:18px 0 6px;padding:16px;border:1px solid rgba(217,180,106,.24);border-radius:18px;
    background:linear-gradient(160deg,rgba(31,25,16,.92),rgba(13,12,9,.92));box-shadow:0 16px 42px rgba(0,0,0,.34)}
  .share-actions-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .share-action-btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-family:'Heebo',sans-serif;
    font-size:15px;font-weight:900;cursor:pointer;color:#0b0a08;background:linear-gradient(140deg,var(--gold),#f0d18a);
    box-shadow:0 12px 30px rgba(217,180,106,.26)}
  .share-action-btn.secondary{color:var(--text);background:rgba(255,255,255,.055);border:1px solid rgba(217,180,106,.3);
    box-shadow:none}
  .share-action-help{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}
  .share-status{min-height:18px;margin-top:8px;color:var(--gold);font-size:12px;text-align:center}
  @media(min-width:560px){
    .share-actions-grid{grid-template-columns:1.2fr 1fr}
  }

  .share-wide-label,.share-bracket-card{width:min(1180px,calc(100vw - 32px));
    margin-inline-start:calc((100% - min(1180px,calc(100vw - 32px))) / 2);
    margin-inline-end:calc((100% - min(1180px,calc(100vw - 32px))) / 2)}
  .share-bracket-card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;
    padding:14px 12px 16px;overflow:hidden;box-shadow:0 20px 64px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.03)}
  .sp-scroll-chip{font-size:10.5px;font-weight:700;color:var(--gold);background:rgba(217,180,106,.11);
    border:1px solid rgba(217,180,106,.24);border-radius:999px;padding:4px 10px}
  .bracket-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-color:rgba(217,180,106,.55) transparent;
    padding:6px 2px 10px;direction:ltr}
  .sp-bracket-tree{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr)) minmax(140px,1.16fr) repeat(4,minmax(110px,1fr));
    gap:7px;min-width:1100px;align-items:stretch;position:relative;direction:ltr}
  .sp-bv-col{display:flex;flex-direction:column;justify-content:space-around;padding:4px 0;position:relative;min-height:520px}
  .sp-bv-col-fin{justify-content:center;gap:12px}
  .sp-bv-col-title{font-family:'Sora',sans-serif;font-size:10px;text-align:center;color:var(--gold);text-transform:uppercase;
    letter-spacing:.08em;font-weight:800;padding:3px 0 7px;border-bottom:1px solid rgba(217,180,106,.15);margin-bottom:8px;flex-shrink:0}
  .sp-bv-col-stack{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:6px}
  .sp-bv-match{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px 7px;
    display:flex;flex-direction:column;gap:4px;position:relative;font-size:11px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .sp-bv-team{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;color:rgba(255,255,255,.68);
    background:rgba(0,0,0,.24);min-height:24px;line-height:1.15;direction:rtl}
  .sp-bv-team.picked{background:rgba(16,185,129,.17);color:#fff;font-weight:700;border:1px solid rgba(16,185,129,.45)}
  .sp-bv-team.tbd{color:rgba(255,255,255,.34);font-style:italic}
  .sp-bv-team img,.sp-bv-team .fb-flag-none{width:22px;height:15px;border-radius:3px;object-fit:cover;flex:none}
  .sp-bv-team-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;text-align:start}
  .sp-bv-team-check{width:12px;height:12px;color:#10b981;flex:none}.sp-bv-team:not(.picked) .sp-bv-team-check{display:none}
  .sp-bv-match-vs{font-size:9px;color:rgba(255,255,255,.32);text-align:center;letter-spacing:.1em;padding:1px 0;text-transform:uppercase}
  .sp-bv-champion{background:linear-gradient(135deg,rgba(217,180,106,.25),rgba(217,180,106,.06));border:1.5px solid rgba(217,180,106,.55);
    border-radius:13px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 18px rgba(217,180,106,.15)}
  .sp-bv-champion-trophy{font-size:22px}.sp-bv-champion-label{font-size:9.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
  .sp-bv-champion-name{font-size:13px;font-weight:800;color:#fff}.sp-bv-champion .fb-flag{width:34px;height:23px;border-radius:5px;object-fit:cover}
  .sp-bv-col-r32l .sp-bv-match::after,.sp-bv-col-r16l .sp-bv-match::after,.sp-bv-col-qfl .sp-bv-match::after,.sp-bv-col-sfl .sp-bv-match::after{
    content:'';position:absolute;inset-inline-end:-8px;top:50%;width:8px;height:1px;background:rgba(217,180,106,.46);pointer-events:none;z-index:1}
  .sp-bv-col-r32r .sp-bv-match::before,.sp-bv-col-r16r .sp-bv-match::before,.sp-bv-col-qfr .sp-bv-match::before,.sp-bv-col-sfr .sp-bv-match::before{
    content:'';position:absolute;inset-inline-start:-8px;top:50%;width:8px;height:1px;background:rgba(217,180,106,.46);pointer-events:none;z-index:1}
  .sp-bv-pair-wrap{display:flex;flex-direction:column;flex:1;justify-content:space-around;position:relative;padding:0}
  .sp-bv-pair-wrap.left::after{content:'';position:absolute;inset-inline-end:0;top:25%;bottom:25%;width:1px;background:rgba(217,180,106,.42);pointer-events:none}
  .sp-bv-pair-wrap.right::before{content:'';position:absolute;inset-inline-start:0;top:25%;bottom:25%;width:1px;background:rgba(217,180,106,.42);pointer-events:none}

  .viewer-cta{margin-top:34px;text-align:center;background:linear-gradient(160deg,#211a0f,#14110b);
    border:1px solid var(--line);border-radius:20px;padding:26px 22px}
  .viewer-cta h2{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;margin-bottom:7px}
  .viewer-cta p{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
  .viewer-cta a{display:inline-block;background:linear-gradient(140deg,var(--gold),#a9853c);color:var(--ink);
    font-weight:800;font-size:15px;text-decoration:none;padding:13px 30px;border-radius:30px;
    box-shadow:0 10px 28px rgba(217,180,106,.3)}

  @media(max-width:430px){
    .wrap{padding:14px 12px 46px}
    .brandbar{margin-bottom:14px}
    h1.title{font-size:20px}.subtitle{margin-bottom:16px}
    .share-hero{min-height:620px;border-radius:18px}
    .share-hero-body{padding:0 12px 18px}
    .share-hero-name{font-size:30px}
    .section-label{margin-top:24px}
    .share-wide-label,.share-bracket-card{width:calc(100vw - 20px);
      margin-inline-start:calc((100% - (100vw - 20px)) / 2);
      margin-inline-end:calc((100% - (100vw - 20px)) / 2)}

function param(k){ return new URLSearchParams(location.search).get(k); }

function render(picks){
  const S = window.FBShare;
  const lang = picks.lang || 'he';
  const L = I18N[lang] || I18N.he;
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  // Escape any user-controlled string before it reaches innerHTML below. nickname
  // and player_name are attacker-controlled at signup/pick time (the server RPCs
  // only length-check them), so injecting them raw was a stored-XSS sink on the
  // friendlybet.live origin. team codes go through tn() (a fixed lookup) and are safe.
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  document.title = `${esc(picks.nickname)} · ${L.title} · FriendlyBet`;

  // teamName returns the RAW code for an unknown code, and knockout_picks.predicted_winner
  // has NO teams FK -> a crafted bracket pick can carry HTML. Escape every team-name render
  // (tn is display-only, always going into innerHTML) so a malicious code can't inject.
  const knownTeams = new Set(Object.values(S.WC2026_GROUPS || {}).flat());
  const safeTeamCode = (c) => knownTeams.has(c) ? c : '';
  const tn = (c) => esc(S.teamName(c, lang));
  const fl = (c, st) => S.flagImg(safeTeamCode(c), { style: st || '' });

  const isTwoPhase = picks.mode === 'two_phase';
  const bracket = isTwoPhase ? null : S.resolveBracket(picks);
  const champ = isTwoPhase ? null : (picks.tournamentWinner || (picks.bracketPicks||{})[31]);
  const fin = bracket ? bracket.final : {};
  const finalist = (!isTwoPhase && fin.home === champ) ? fin.away : fin.home;
  const champRoad = isTwoPhase ? [] : S.teamRoad(picks, champ, bracket);
  const finRoad = isTwoPhase ? [] : S.teamRoad(picks, finalist, bracket);
  const hasRoads = !isTwoPhase && !!(champ && finalist);
  const ts = picks.topScorer;

  // Two self-contained lanes (one per finalist) + a central round axis. Each
  // lane runs top→bottom from semi-final down to the last 32, and every step
  // says "<finalist> beat X" so the two paths can't be confused for a match.
  const ROUND_ORDER = ['SF','QF','R16','R32'];
  const beatOf = (road, rk) => { const e = road.find(x => x.round === rk); return e ? e.beat : null; };
  const laneStep = (beat) => `
    <div class="lane-step">
      <span class="won">${L.beat}</span>
      <span class="opp">${beat ? `${fl(beat)}<span class="nm">${tn(beat)}</span>` : '—'}</span>
    </div>`;
  const lane = (code, road, isChamp) => `
    <div class="lane ${isChamp ? 'is-champ' : ''}">
      <div class="lane-head">
        ${fl(code)}<span class="lh-nm">${code ? tn(code) : '—'}</span>
      </div>
      ${ROUND_ORDER.map(rk => laneStep(beatOf(road, rk))).join('')}
    </div>`;
  const axisHtml = `
    <div class="axis">
      <div class="axis-head"></div>
      ${ROUND_ORDER.map(rk => `<div class="axis-step"><span class="rnd">${L.rounds[rk] || rk}</span></div>`).join('')}
    </div>`;

  // The Final matchup (its own box again): both finalists, champion marked.
  const finalSide = (code, isWin) => `
    <div class="fb-side ${isWin ? 'win' : ''}">
      ${fl(code)}
      <span class="fb-name">${code ? tn(code) : '—'}</span>
    </div>`;

  const groupsHtml = S.WC2026_GROUP_LETTERS.map(letter => {
    const arr = (picks.groupPositions||{})[letter] || [];
    const rows = [0,1,2,3].map(i => {
      const c = arr[i];
      return `<div class="row ${i===0?'first':''}">
        <span class="pos">${i+1}</span>${c?fl(c):'<span class="fb-flag-none">—</span>'}
        <span class="nm">${c?tn(c):'—'}</span></div>`;
    }).join('');
    return `<div class="grp"><div class="gh">${lang==='he'?'בית':'Group'} ${letter}</div>${rows}</div>`;
  }).join('');

  const twoPhaseGroupsHtml = S.WC2026_GROUP_LETTERS.map(letter => {
    const selected = new Set((picks.groupAdvancers || {})[letter] || []);
    const teams = S.WC2026_GROUPS[letter] || [];
    const rows = teams.map(c => {
      const adv = selected.has(c);
      return `<div class="row ${adv ? 'advancing' : ''}">
        <span class="pos">${adv ? '&#10003;' : ''}</span>${fl(c)}
        <span class="nm">${tn(c)}</span></div>`;
    }).join('');
    const count = selected.size
      ? (L.pickedAdvancers || '{n} picks').replace('{n}', selected.size)
      : L.noGroupPicks;
    return `<div class="grp two-phase"><div class="gh"><span>${L.groupWord || 'Group'} ${letter}</span><span class="gc">${esc(count)}</span></div>${rows}</div>`;
  }).join('');
  const phaseGroupsHtml = isTwoPhase ? twoPhaseGroupsHtml : groupsHtml;
  const heroSrc = champ ? `/heroes/hero-${encodeURIComponent(champ)}.webp` : '/og-image.png';
  const fullRoad = champ
    ? [...champRoad, { round:'FINAL', beat: finalist }].filter(step => step && step.beat)
    : [];
  const roadStep = (step) => `
    <div class="victory-step ${step.round === 'FINAL' ? 'final' : ''}">
      <div class="rd">${step.round}</div>
      ${fl(step.beat)}
      <div class="nm">${tn(step.beat)}</div>
    </div>`;

  const BR_R16_DEF = { 17:[2,5], 18:[1,3], 19:[4,6], 20:[7,8], 21:[11,12], 22:[9,10], 23:[14,16], 24:[13,15] };
  const BR_QF_DEF = { 25:[17,18], 26:[21,22], 27:[19,20], 28:[23,24] };
  const BR_SF_DEF = { 29:[25,26], 30:[27,28] };
  const BR_FINAL_DEF = { 31:[29,30] };
  const BR_PARENTS = (() => {
    const map = {};
    [BR_R16_DEF, BR_QF_DEF, BR_SF_DEF, BR_FINAL_DEF].forEach(def => {
      Object.entries(def).forEach(([dst, pair]) => { map[pair[0]] = +dst; map[pair[1]] = +dst; });
    });
    return map;
  })();
  const byPos = (arr, positions) => positions.map(pos => (arr || []).find(m => m.pos === pos)).filter(Boolean);
  const leftR16 = [17, 18, 21, 22];
  const rightR16 = [19, 20, 23, 24];
  const leftR32 = [];
  const rightR32 = [];
  for (let pos = 1; pos <= 16; pos++) {
    if (leftR16.includes(BR_PARENTS[pos])) leftR32.push(pos);
    else if (rightR16.includes(BR_PARENTS[pos])) rightR32.push(pos);
  }
  const bvTeam = (code, winner) => code
    ? `<div class="sp-bv-team ${winner === code ? 'picked' : ''}">${fl(code)}<span class="sp-bv-team-name">${tn(code)}</span><svg class="sp-bv-team-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`
    : `<div class="sp-bv-team tbd"><span class="fb-flag-none">-</span><span class="sp-bv-team-name">-</span></div>`;
  const bvMatch = (match) => `<div class="sp-bv-match">${bvTeam(match && match.home, match && match.winner)}<div class="sp-bv-match-vs">vs</div>${bvTeam(match && match.away, match && match.winner)}</div>`;
  const bvPairColumn = (matches, side, perPair = 2) => {
    const out = [];
    for (let i = 0; i < matches.length; i += perPair) {
      out.push(`<div class="sp-bv-pair-wrap ${side}">${matches.slice(i, i + perPair).map(bvMatch).join('')}</div>`);
    }
    return out.join('');
  };
  const bvCol = (cls, title, inner) => `<div class="sp-bv-col ${cls}"><div class="sp-bv-col-title">${title}</div><div class="sp-bv-col-stack">${inner}</div></div>`;
  const championHtml = `<div class="sp-bv-champion">
    <div class="sp-bv-champion-trophy">&#127942;</div>
    <div class="sp-bv-champion-label">${L.winnerLabel}</div>
    ${champ ? fl(champ) : ''}
    <div class="sp-bv-champion-name">${champ ? tn(champ) : '-'}</div>
  </div>`;
  const bracketTree = bracket ? [
    bvCol('sp-bv-col-r32l', 'R32', bvPairColumn(byPos(bracket.r32, leftR32), 'left')),
    bvCol('sp-bv-col-r16l', 'R16', bvPairColumn(byPos(bracket.r16, leftR16), 'left')),
    bvCol('sp-bv-col-qfl', 'QF', bvPairColumn(byPos(bracket.qf, [25, 26]), 'left')),
    bvCol('sp-bv-col-sfl', 'SF', byPos(bracket.sf, [29]).map(bvMatch).join('')),
    `<div class="sp-bv-col sp-bv-col-fin"><div class="sp-bv-col-title">FINAL</div>${bvMatch(bracket.final)}${championHtml}</div>`,
    bvCol('sp-bv-col-sfr', 'SF', byPos(bracket.sf, [30]).map(bvMatch).join('')),
    bvCol('sp-bv-col-qfr', 'QF', bvPairColumn(byPos(bracket.qf, [27, 28]), 'right')),
    bvCol('sp-bv-col-r16r', 'R16', bvPairColumn(byPos(bracket.r16, rightR16), 'right')),
    bvCol('sp-bv-col-r32r', 'R32', bvPairColumn(byPos(bracket.r32, rightR32), 'right'))
  ].join('') : '';
  const hasLocalUser = (() => {
    try { return !!localStorage.getItem('fb_user_id'); } catch (_) { return false; }
  })();
  const cta = hasLocalUser
    ? { h:L.ctaDashboardH, p:L.ctaDashboardP, btn:L.ctaDashboardBtn, href:'https://friendlybet.live' }
    : { h:L.ctaNewH, p:L.ctaNewP, btn:L.ctaNewBtn, href:'https://friendlybet.live' };
  const heroShareSrc = champ ? `/og-heroes/hero-${encodeURIComponent(champ)}.jpg` : '/og-image.png';
  window.FBSharePublic = {
    imageUrl: new URL(heroShareSrc, location.origin).href,
    pageUrl: location.href,
    imageFileName: `friendlybet-${champ || 'prediction'}-road-to-victory.jpg`
  };

  document.getElementById('root').innerHTML = `
    <div class="brandbar">
      <div class="logo">⚽</div><b>FriendlyBet</b><span>· ${L.tournament}</span>
    </div>
    <h1 class="title"><span class="who">${esc(picks.nickname)}</span> · ${L.title}</h1>
    <div class="subtitle">${isTwoPhase ? L.twoPhaseSub : L.sub}</div>

    ${!isTwoPhase ? `<div class="share-hero">
      <img class="share-hero-img" src="${heroSrc}" alt="" onerror="this.onerror=null;this.src=this.src.replace('.webp','.jpg')">
      <div class="share-hero-body">
        <div class="share-hero-kicker">${L.heroKicker}</div>
        <div class="share-hero-name">${champ ? tn(champ) : '—'}</div>
        <div class="share-hero-sub">${esc((L.heroSub || '').replace('{name}', picks.nickname || ''))}</div>
        <div class="victory-road">${fullRoad.map(roadStep).join('')}</div>
      </div>
    </div>` : ''}

    ${!isTwoPhase ? `<div class="share-actions">
      <div class="share-actions-grid">
        <button class="share-action-btn" type="button" onclick="shareVictoryImage()">${L.shareImageBtn}</button>
        <button class="share-action-btn secondary" type="button" onclick="shareFullBracket()">${L.shareBracketBtn}</button>
      </div>
      <div class="share-action-help">${L.shareImageHelp}</div>
      <div class="share-status" id="share-status" aria-live="polite"></div>
    </div>` : ''}

    ${bracketTree ? `<div class="section-label share-wide-label">${L.bracketLabel}</div>
    <div class="share-bracket-card">
      <div class="sp-scroll-chip" style="display:inline-block;margin:0 4px 10px">${L.bracketHint}</div>
      <div class="bracket-scroll" dir="ltr"><div class="sp-bracket-tree share-bracket-tree">${bracketTree}</div></div>
    </div>` : ''}

    <div class="section-label">${isTwoPhase ? L.advancersLabel : L.groupsLabel}</div>
    <div class="groups">${phaseGroupsHtml}</div>

    ${isTwoPhase ? `
    <div class="section-label">${L.knockoutLabel}</div>
    <div class="locked-panel">
      <div class="lock-icon">!</div>
      <div>
        <h2>${L.knockoutLockedTitle}</h2>
        <p>${L.knockoutLockedBody}</p>
      </div>
    </div>` : ''}

    <div class="viewer-cta">
      <h2>${cta.h}</h2>
      <p>${cta.p}</p>
      <a href="${cta.href}">${cta.btn}</a>
    </div>
    <footer>${L.made} <a href="https://friendlybet.live">friendlybet.live</a> · ⚽ FriendlyBet</footer>
  `;
  requestAnimationFrame(() => {
    document.querySelectorAll('.bracket-scroll').forEach(el => {
      const max = el.scrollWidth - el.clientWidth;
      if (max > 0) el.scrollLeft = Math.round(max / 2);
    });
  });
}

function setShareStatus(message){
  const el = document.getElementById('share-status');
  if (el) el.textContent = message || '';
}

async function shareVictoryImage(){
  const cfg = window.FBSharePublic || {};
  const L = I18N[document.documentElement.lang] || I18N.he;
  if (!cfg.imageUrl) return;
  try {
    const response = await fetch(cfg.imageUrl, { cache:'force-cache' });
    if (!response.ok) throw new Error('image fetch failed');
    const blob = await response.blob();
    const file = new File([blob], cfg.imageFileName || 'friendlybet-road-to-victory.jpg', { type: blob.type || 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share) {
      await navigator.share({ files:[file], title:L.shareImageTitle });
      setShareStatus('');
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
    setShareStatus(L.shareDownloaded);
  } catch (err) {
    try {
      await navigator.clipboard.writeText(cfg.imageUrl);
      setShareStatus(L.shareCopied);
    } catch (_) {
      location.href = cfg.imageUrl;
    }
  }
}

async function shareFullBracket(){
  const cfg = window.FBSharePublic || {};
  const L = I18N[document.documentElement.lang] || I18N.he;
  const url = cfg.pageUrl || location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title:L.shareBracketTitle, text:L.shareBracketTitle, url });
      setShareStatus('');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    setShareStatus(L.shareCopied);
  } catch (_) {
    location.href = url;
  }
}

window.shareVictoryImage = shareVictoryImage;
window.shareFullBracket = shareFullBracket;

async function fetchRealPicksPhaseAware(userId, poolId, lang){
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const sb = createClient(
    'https://kovhuahdoluxyqqwqohw.supabase.co',
    'sb_publishable_Aj_p7rZjAat_-ros9gzD_g_AsPtotpU'
  );
  const [usr, gp, g2p, kp, tw, ts, tp] = await Promise.all([
    sb.from('users').select('nickname').eq('id', userId).maybeSingle(),
    sb.from('group_position_picks').select('group_letter,position,team_code').eq('pool_id',poolId).eq('user_id',userId),
    sb.from('group_picks').select('group_letter,team_code').eq('pool_id',poolId).eq('user_id',userId),
    sb.rpc('get_public_bracket', { p_user_id: userId, p_pool_id: poolId }),
    sb.from('tournament_winner_picks').select('team_code').eq('pool_id',poolId).eq('user_id',userId).maybeSingle(),
    sb.from('top_scorer_picks').select('player_name,team_code').eq('pool_id',poolId).eq('user_id',userId).maybeSingle(),
    sb.from('sp_third_place_picks').select('group_letter').eq('pool_id',poolId).eq('user_id',userId)
  ]);
  const nickname = (usr.data && usr.data.nickname) || (lang==='he' ? '\u05e9\u05d7\u05e7\u05df' : 'Player');
  const singleRows = gp.data || [];
  const twoPhaseRows = g2p.data || [];

  if (twoPhaseRows.length && !singleRows.length) {
    const groupAdvancers = {};
    twoPhaseRows.forEach(r => {
      if (!r || !r.group_letter || !r.team_code) return;
      const arr = (groupAdvancers[r.group_letter] = groupAdvancers[r.group_letter] || []);
      if (!arr.includes(r.team_code)) arr.push(r.team_code);
    });
    Object.keys(groupAdvancers).forEach(letter => {
      const order = window.FBShare.WC2026_GROUPS[letter] || [];
      groupAdvancers[letter].sort((a,b) => order.indexOf(a) - order.indexOf(b));
    });
    return { nickname, lang, mode:'two_phase', groupAdvancers };
  }

  const groupPositions = {};
  singleRows.forEach(r => {
    (groupPositions[r.group_letter] = groupPositions[r.group_letter] || [])[r.position-1] = r.team_code;
  });
  const bracketPicks = {};
  (kp.data||[]).forEach(r => { bracketPicks[r.bracket_position] = r.predicted_winner; });
  return {
    nickname, lang, mode:'single_phase', groupPositions, bracketPicks,
    thirdPlaceAdvancers: (tp.data||[]).map(r => r.group_letter),
    tournamentWinner: (tw.data && tw.data.team_code) || bracketPicks[31],
    topScorer: ts.data || null
  };
}
