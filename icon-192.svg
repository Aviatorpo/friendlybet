<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2942;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg)" rx="32"/>

  <!-- Subtle gold halo -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#d4a853" stroke-width="2" opacity="0.35"/>

  <!-- Soccer ball -->
  <g transform="translate(96, 96)">
    <circle r="62" fill="#ffffff" stroke="#0a1628" stroke-width="4"/>
    <!-- Center black pentagon -->
    <polygon points="0,-23 21.9,-7.1 13.5,18.6 -13.5,18.6 -21.9,-7.1" fill="#0a1628"/>
    <!-- 5 edge accents from pentagon vertices toward circle edge -->
    <line x1="0" y1="-23" x2="0" y2="-58" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="21.9" y1="-7.1" x2="55.2" y2="-17.9" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13.5" y1="18.6" x2="34.1" y2="46.9" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-13.5" y1="18.6" x2="-34.1" y2="46.9" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-21.9" y1="-7.1" x2="-55.2" y2="-17.9" stroke="#0a1628" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
