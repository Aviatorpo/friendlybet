<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2942"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="192" height="192" fill="url(#bg)" rx="36"/>

  <!-- Soft gold glow + ring -->
  <circle cx="96" cy="96" r="76" fill="#d4a853" opacity="0.10"/>
  <circle cx="96" cy="96" r="73" fill="none" stroke="#d4a853" stroke-width="2" opacity="0.55"/>

  <g transform="translate(96, 96)">
    <!-- Ball with subtle 3D shading -->
    <circle r="62" fill="url(#ballGrad)" stroke="#0a1628" stroke-width="3"/>

    <!-- Center pentagon -->
    <polygon points="0,-23 21.9,-7.1 13.5,18.6 -13.5,18.6 -21.9,-7.1" fill="#0a1628"/>

    <!-- 5 seam spokes radiating from each pentagon vertex -->
    <g stroke="#0a1628" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="0"     y1="-23"  x2="0"     y2="-53"/>
      <line x1="21.9"  y1="-7.1" x2="50.4"  y2="-16.4"/>
      <line x1="13.5"  y1="18.6" x2="31.1"  y2="42.8"/>
      <line x1="-13.5" y1="18.6" x2="-31.1" y2="42.8"/>
      <line x1="-21.9" y1="-7.1" x2="-50.4" y2="-16.4"/>
    </g>

    <!-- 5 rim patches (where outer pentagons would be) -->
    <g fill="#0a1628">
      <circle cx="0"     cy="-53"  r="6"/>
      <circle cx="50.4"  cy="-16.4" r="6"/>
      <circle cx="31.1"  cy="42.8"  r="6"/>
      <circle cx="-31.1" cy="42.8"  r="6"/>
      <circle cx="-50.4" cy="-16.4" r="6"/>
    </g>
  </g>
</svg>
