<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2942"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="192" height="192" fill="url(#bg)" rx="36"/>

  <!-- v2.5.90: drawn vector soccer ball instead of an emoji glyph. The old emoji-text
       glyph relied on an OS emoji font; Googlebot and some Android
       launchers don't render it, leaving a blank icon. -->
  <circle cx="96" cy="96" r="67" fill="#d4a853"/>
  <g stroke="#0a1628" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="96,66 126,87 115,122 77,122 66,87" fill="#0a1628"/>
    <line x1="96" y1="66" x2="96" y2="36"/>
    <line x1="126" y1="87" x2="155" y2="78"/>
    <line x1="66" y1="87" x2="37" y2="78"/>
    <line x1="77" y1="122" x2="59" y2="152"/>
    <line x1="115" y1="122" x2="133" y2="152"/>
  </g>
</svg>
