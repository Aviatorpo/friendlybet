<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2942;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0b966;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg)" rx="32"/>
  
  <!-- Decorative circles (subtle) -->
  <circle cx="40" cy="40" r="60" fill="#d4a853" opacity="0.05"/>
  <circle cx="160" cy="160" r="50" fill="#d4a853" opacity="0.05"/>
  
  <!-- Trophy -->
  <g transform="translate(96, 96)">
    <!-- Trophy cup -->
    <path d="M -28 -32 L 28 -32 L 24 8 Q 24 24 0 24 Q -24 24 -24 8 Z" 
          fill="url(#gold)" stroke="#b88a3a" stroke-width="1"/>
    
    <!-- Handles -->
    <path d="M -28 -24 Q -42 -24 -42 -8 Q -42 4 -28 4" 
          fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 28 -24 Q 42 -24 42 -8 Q 42 4 28 4" 
          fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Base -->
    <rect x="-12" y="22" width="24" height="6" fill="#b88a3a"/>
    <rect x="-20" y="28" width="40" height="6" rx="2" fill="url(#gold)"/>
    
    <!-- Star on trophy -->
    <text x="0" y="2" font-size="22" text-anchor="middle" fill="#0a1628" font-weight="bold">★</text>
  </g>
  
  <!-- Small soccer ball decoration -->
  <text x="40" y="160" font-size="20" opacity="0.4">⚽</text>
</svg>
