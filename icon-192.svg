<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2942"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f1f1f1"/>
      <stop offset="100%" stop-color="#c2c2c2"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="192" height="192" fill="url(#bg)" rx="36"/>

  <!-- Subtle gold halo + ring -->
  <circle cx="96" cy="96" r="76" fill="#d4a853" opacity="0.10"/>
  <circle cx="96" cy="96" r="73" fill="none" stroke="#d4a853" stroke-width="2" opacity="0.55"/>

  <g transform="translate(96, 96)">
    <!-- Ball with subtle 3D gradient -->
    <circle r="62" fill="url(#ballGrad)" stroke="#0a1628" stroke-width="3"/>

    <!-- Five rim pentagons (r_o=14, D=44 from center). Each points
         "inward" with its closest vertex 11px above the central
         pentagon's outer vertex, leaving a visible white hexagonal
         gap. The 5 copies are rotated 72° apart. -->
    <g fill="#0a1628">
      <polygon id="rimPent" points="0,-30 13.31,-39.67 8.23,-55.33 -8.23,-55.33 -13.31,-39.67"/>
      <use href="#rimPent" transform="rotate(72)"/>
      <use href="#rimPent" transform="rotate(144)"/>
      <use href="#rimPent" transform="rotate(216)"/>
      <use href="#rimPent" transform="rotate(288)"/>
    </g>

    <!-- Central pentagon (r_c=19) -->
    <polygon points="0,-19 18.07,-5.87 11.17,15.37 -11.17,15.37 -18.07,-5.87" fill="#0a1628"/>
  </g>
</svg>
