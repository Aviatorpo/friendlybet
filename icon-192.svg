<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2942"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="192" height="192" fill="url(#bg)" rx="36"/>

  <!-- Subtle gold halo -->
  <circle cx="96" cy="96" r="76" fill="#d4a853" opacity="0.10"/>
  <circle cx="96" cy="96" r="73" fill="none" stroke="#d4a853" stroke-width="2" opacity="0.55"/>

  <!-- Soccer ball: identical to the home-page logo (⚽). The OS renders
       its native emoji font (Apple Color Emoji on iOS, Noto Color Emoji
       on Android, Segoe UI Emoji on Windows), so the icon matches what
       the user sees inside the app on every platform. -->
  <text x="96" y="96"
        font-size="124"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif">⚽</text>
</svg>
